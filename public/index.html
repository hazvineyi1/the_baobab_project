<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>The Baobab Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ═══ Aged stone above, deep umber below, burnished brass for the accents ═══
   Pulled away from sand towards stone and umber: the sand read as holiday,
   and this is a record a family keeps. The accent is antique brass rather
   than orange, the soil carries real weight at the foot of the page, and the
   ink is deep enough that names hold their own against it. */
:root{
  --sky:#EFEAE0; --sky-far:#DED7C8;
  --soil:#C6B296; --soil-deep:#A08A6C; --horizon:#8C7452;
  --bark:#6F5F49; --bark-lit:#8C7C63; --bark-dark:#4E4133;
  --bark-thin:#8A7A62; --root:#7A6647;
  --pod:#FCFAF4; --pod-edge:#C3B49A; --pod-hi:#F2ECDE;
  --ink:#221C13; --muted:#6E6555;
  --gold:#8A5A16; --gold-soft:#B0812F; --leaf:#3F5A2E;
  --shadow:0 2px 10px rgba(34,28,19,.14);
  --lift:0 10px 30px rgba(34,28,19,.24);
}
/* Night over the savannah: a deep blue-black sky, soil that goes almost to
   black underfoot, and brass warm enough to feel lit rather than printed. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky:#0B0E13; --sky-far:#141922;
    --soil:#120E0A; --soil-deep:#070504; --horizon:#4A3A26;
    --bark:#8B7A5F; --bark-lit:#B0A085; --bark-dark:#5E5140;
    --bark-thin:#6E6049; --root:#7C6A4E;
    --pod:#171B22; --pod-edge:#333B47; --pod-hi:#11151B;
    --ink:#F0EADC; --muted:#95907F;
    --gold:#D9A441; --gold-soft:#EFC877; --leaf:#8FA875;
    --shadow:0 2px 12px rgba(0,0,0,.55);
    --lift:0 10px 32px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --sky:#0B0E13; --sky-far:#141922;
  --soil:#120E0A; --soil-deep:#070504; --horizon:#4A3A26;
  --bark:#8B7A5F; --bark-lit:#B0A085; --bark-dark:#5E5140;
  --bark-thin:#6E6049; --root:#7C6A4E;
  --pod:#171B22; --pod-edge:#333B47; --pod-hi:#11151B;
  --ink:#F0EADC; --muted:#95907F;
  --gold:#D9A441; --gold-soft:#EFC877; --leaf:#8FA875;
  --shadow:0 2px 12px rgba(0,0,0,.55);
  --lift:0 10px 32px rgba(0,0,0,.7);
}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0; background:var(--sky); color:var(--ink);
  font-family:'Karla','Helvetica Neue',Arial,sans-serif;
  overflow:hidden; -webkit-tap-highlight-color:transparent;
}

/* ── stage ──────────────────────────────────────────────────────────── */
#stage{position:fixed; inset:0; cursor:grab; touch-action:none;}
#stage.dragging{cursor:grabbing;}
#sky{position:absolute; inset:0; background:linear-gradient(var(--sky-far),var(--sky) 60%);}
/* Corners fall away very slightly. It is barely perceptible on its own and it
   is most of what separates a page that feels composed from one that feels
   flat — it settles the eye in the middle, where the family is. */
#stage::after{
  content:''; position:absolute; inset:0; pointer-events:none; z-index:2;
  background:radial-gradient(ellipse 78% 68% at 50% 46%,
    transparent 55%, rgba(34,28,19,.10) 100%);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #stage::after{
    background:radial-gradient(ellipse 78% 68% at 50% 46%,
      transparent 48%, rgba(0,0,0,.42) 100%);
  }
}
:root[data-theme="dark"] #stage::after{
  background:radial-gradient(ellipse 78% 68% at 50% 46%,
    transparent 48%, rgba(0,0,0,.42) 100%);
}
#ground{position:absolute; left:0; right:0; background:linear-gradient(var(--soil),var(--soil-deep));}
#groundline{position:absolute; left:0; right:0; height:1px; background:var(--horizon); opacity:.6;}
/* The tree the whole thing is named for, standing a long way behind the
   family. Faint enough to read as texture rather than picture — it should be
   noticed on the second look, not the first. */
#backdrop{position:absolute; inset:0; overflow:visible; pointer-events:none;}
/* One opacity governs the whole backdrop. Everything inside is drawn at full
   strength so the light-and-shadow relationships across the trunk survive —
   fading each part separately is what flattened the first attempt, and left
   the grain shouting over a trunk that had gone invisible. */
/* Softened on purpose. A tree this far away is never crisp in a photograph —
   distance and depth of field take the edges off it — and hard vector edges
   are what make a generated tree read as a diagram no matter how good the
   geometry underneath is. This is the cheapest honest step towards looking
   photographed rather than drawn.
   
   Applied to the inner group rather than through an SVG filter: the group is
   re-transformed on every pan frame, and a filter primitive would re-run the
   whole graph each time, where a CSS blur composites a cached layer. */
#bgTree{opacity:.16; filter:blur(2.8px);}
/* A photograph needs different handling from a drawing: the colour has to go,
   or the backdrop starts arguing with the palette, and it needs to sit further
   back than a drawn tree because a photograph carries far more detail. */
/* Softened as a whole, the way the drawn tree is — a photograph of something
   this far off is not crisp either. */
#bgTree.has-photo{opacity:1; filter:blur(1.6px);}
.bg-photo{opacity:.13;}
/* Fainter than the crown, never stronger. The depth-group opacity on top of
   this is what makes the roots arrive as the view descends. */
.bg-photo-roots{opacity:.12;}
/* Against a near-black sky the mid bark tone all but disappears, so the night
   theme lifts both the colour and the weight. */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .bg-photo{fill:var(--bark-lit); opacity:.3;}
  :root:not([data-theme="light"]) .bg-photo-roots{fill:var(--bark); opacity:.26;}
}
:root[data-theme="dark"] .bg-photo{fill:var(--bark-lit); opacity:.3;}
:root[data-theme="dark"] .bg-photo-roots{fill:var(--bark); opacity:.26;}
.bg-trunk{fill:url(#bgBark);}
.bg-grain{fill:none; stroke:var(--bark-dark); stroke-linecap:round; opacity:.28;}
/* Subordinate to the mass. Drawn at full strength the limbs became the only
   thing visible — a set of dark antlers over a pale blob — because bare
   structure has far more edge per unit of area than a trunk or a crown does.
   They are meant to be read second, as the architecture inside the shape. */
.bg-limb{fill:url(#bgLimbGrad); opacity:.5;}
.bg-haze{fill:url(#bgHazeGrad); opacity:.62;}
.bg-root{fill:var(--root);}
.bg-roots{opacity:.35;}                       /* raised as the view descends */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) #bgTree{opacity:.26;}
  /* against a dark ground the grain has to lighten, not darken */
  :root:not([data-theme="light"]) .bg-grain{stroke:var(--bark-lit); opacity:.22;}
}
:root[data-theme="dark"] #bgTree{opacity:.26;}
:root[data-theme="dark"] .bg-grain{stroke:var(--bark-lit); opacity:.22;}

#canvas{position:absolute; inset:0; overflow:visible;}
#pods{position:absolute; inset:0;}
/* Buds live in screen space, not in the tree's, so they stay a constant,
   finger-sized distance from a person however far you have zoomed out. */
#buds{position:absolute; inset:0; pointer-events:none;}
#buds .bud, #buds .term{pointer-events:auto;}
.layer{position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform;}

/* ── branches ───────────────────────────────────────────────────────── */
.branch{fill:none; stroke-linecap:round; stroke:var(--bark);}
.branch.root{stroke:var(--root);}
.branch.unknown{stroke:var(--muted); stroke-width:2; stroke-dasharray:4 6; opacity:.6;}
.bond{stroke:var(--bark-thin); stroke-width:3; stroke-linecap:round; fill:none;}
.bond.reach{stroke-dasharray:none; opacity:.7;}   /* a partner further along the row */
.grow{stroke-dasharray:1400; stroke-dashoffset:1400; animation:draw .55s ease-out forwards;}
@keyframes draw{to{stroke-dashoffset:0;}}

/* ── person pods ────────────────────────────────────────────────────── */
.pod{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  width:132px; min-height:46px; padding:8px 12px;
  background:var(--pod); border:1.5px solid var(--pod-edge);
  border-radius:26px 8px 26px 8px;
  box-shadow:var(--shadow); cursor:pointer; user-select:none;
  transition:box-shadow .18s, border-color .18s;
}
.pod:hover{border-color:var(--gold-soft); box-shadow:var(--lift);}
.pod:focus-visible{outline:2.5px solid var(--gold); outline-offset:3px;}
.pod.sel{border-color:var(--gold); border-width:2px; box-shadow:var(--lift);}
.pod.sprout{animation:pop .45s cubic-bezier(.2,1.5,.4,1) backwards;}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.15); opacity:0;}}
.pod .nm{
  font-family:'Fraunces',Georgia,'Times New Roman',serif; font-weight:500; font-size:15px;
  line-height:1.22; text-align:center; color:var(--ink); word-break:break-word;
}
.pod .tot{
  font-size:9.5px; letter-spacing:.11em; text-transform:uppercase;
  color:var(--muted); margin-top:4px;
}
.pod .mk{position:absolute; left:9px; top:5px; font-size:10px; color:var(--gold-soft);}
.pod .rm{
  position:absolute; right:-9px; top:-9px; width:22px; height:22px; border-radius:50%;
  display:none; align-items:center; justify-content:center;
  background:var(--pod); border:1.5px solid var(--pod-edge); color:var(--muted);
  font-size:12px; line-height:1; cursor:pointer;
}
.pod.sel .rm{display:flex;}
.pod .rm:hover{border-color:var(--gold); color:var(--gold);}

/* move somebody earlier or later among their brothers and sisters */
.pod .ord{
  position:absolute; top:50%; margin-top:-13px; width:26px; height:26px;
  border-radius:50%; display:none; align-items:center; justify-content:center;
  background:var(--pod); border:1.5px solid var(--pod-edge); color:var(--muted);
  font-size:14px; line-height:1; cursor:pointer;
}
.pod .ord.older{left:-14px;} .pod .ord.younger{right:-14px;}
.pod.sel .ord{display:flex;}
.pod .ord:hover{border-color:var(--gold); color:var(--gold);}

/* eldest → youngest runs left to right; the rank sits under the name */
.pod .rank{
  font-size:9px; letter-spacing:.14em; text-transform:uppercase;
  color:var(--gold-soft); margin-top:3px; font-weight:700;
}

/* the furthest ancestor anybody can trace — the taproot of the line */
.pod.taproot{
  background:var(--soil); border-color:var(--root); border-width:2.5px;
  border-radius:8px 26px 8px 26px;
}
.pod.taproot .nm{font-weight:600;}
.pod.taproot .badge{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  padding:2px 9px; border-radius:999px; white-space:nowrap;
  background:var(--root); color:var(--sky);
  font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}
.pod .dates{
  font-size:9.5px; color:var(--muted); margin-top:3px;
  font-variant-numeric:tabular-nums;
}
/* whoever is holding the phone */
.pod.you{border-color:var(--leaf); box-shadow:0 0 0 3px color-mix(in srgb, var(--leaf) 22%, transparent);}
.pod.you .badge{
  position:absolute; top:-10px; left:50%; transform:translateX(-50%);
  padding:2px 9px; border-radius:999px; background:var(--leaf); color:var(--sky);
  font-size:8.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
}

/* an empty socket where somebody's parents will go */
.pod.socket{
  background:transparent; border-style:dashed; border-color:var(--pod-edge);
  box-shadow:none; min-height:38px; width:112px;
}
.pod.socket .nm{
  font-family:'Karla',sans-serif; font-size:11.5px; font-weight:600;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
}
.pod.socket:hover{border-color:var(--gold); border-style:solid;}
.pod.socket:hover .nm{color:var(--gold);}

/* ── buds: the four ways the tree can grow ──────────────────────────── */
.bud{
  position:absolute; transform:translate(-50%,-50%);
  display:flex; align-items:center; gap:6px;
  padding:6px 12px 6px 9px; border-radius:999px;
  background:var(--pod); border:1.5px dashed var(--gold-soft); color:var(--gold);
  font-size:11.5px; font-weight:700; letter-spacing:.05em;
  white-space:nowrap; cursor:pointer; box-shadow:var(--shadow);
  animation:bud .24s ease-out backwards;
}
.bud:hover{background:var(--gold); border-style:solid; border-color:var(--gold); color:var(--pod);}
.bud:focus-visible{outline:2.5px solid var(--gold); outline-offset:3px;}
.bud i{font-style:normal; font-size:13px; line-height:1;}
@keyframes bud{from{opacity:0; transform:translate(-50%,-50%) scale(.4);}}

/* what this person is to you, in the family's own words */
.term{
  position:absolute; transform:translate(-50%,-50%);
  max-width:230px; padding:8px 14px; border-radius:16px 5px 16px 5px;
  background:var(--leaf); color:var(--sky); box-shadow:var(--lift);
  text-align:center; pointer-events:auto; cursor:pointer;
  animation:bud .24s ease-out backwards;
}
.term b{
  display:block; font-family:'Fraunces',Georgia,serif;
  font-size:17px; font-weight:600; letter-spacing:.01em;
}
.term span{display:block; font-size:10.5px; line-height:1.4; opacity:.85; margin-top:2px;}
.term.none{background:var(--pod); color:var(--muted); border:1.5px dashed var(--pod-edge);}
.term.none b{color:var(--ink); font-size:13px;}

/* ── the grow form ──────────────────────────────────────────────────── */
#form{
  position:absolute; transform:translate(-50%,-50%); z-index:40;
  width:252px; padding:15px; border-radius:22px 6px 22px 6px;
  background:var(--pod); border:2px solid var(--gold);
  box-shadow:var(--lift); animation:bud .2s ease-out backwards;
  max-height:calc(100vh - 110px); overflow-y:auto;   /* short screens still reach Grow */
}
#form .cap{
  font-size:10.5px; letter-spacing:.12em; text-transform:uppercase;
  color:var(--muted); margin:0 0 10px; line-height:1.5;
}
#form .cap b{color:var(--gold); font-weight:700;}
#form .relline{
  margin:0 0 12px; padding:9px 11px; border-radius:12px 4px 12px 4px;
  background:var(--leaf); color:var(--sky);
}
#form .relline b{
  display:block; font-family:'Fraunces',Georgia,serif; font-size:18px; font-weight:600;
}
#form .relline span{display:block; font-size:11px; line-height:1.45; opacity:.88;}
.btn.wide{width:100%; flex:none; margin-bottom:8px; text-align:center;}

/* somebody by this name may already be in the tree */
#form .dupes{margin:0 0 10px;}
#form .dupe{
  display:flex; align-items:center; gap:8px; width:100%;
  padding:8px 10px; margin-bottom:6px; border-radius:12px 4px 12px 4px;
  background:var(--pod-hi); border:1.5px solid var(--gold-soft);
  color:var(--ink); font-family:'Karla',sans-serif; font-size:12px;
  text-align:left; cursor:pointer;
}
#form .dupe:hover{border-color:var(--gold); background:var(--pod);}
#form .dupe u{
  flex:1; text-decoration:none; display:block;
  font-family:'Fraunces',Georgia,serif; font-size:14px; font-weight:500;
}
#form .dupe u small{
  display:block; font-family:'Karla',sans-serif; font-size:10.5px;
  color:var(--muted); font-weight:400; margin-top:1px;
}
#form .dupe em{
  font-style:normal; font-size:10.5px; font-weight:700; letter-spacing:.06em;
  text-transform:uppercase; color:var(--gold); white-space:nowrap;
}
#form .dupe[disabled]{opacity:.6; cursor:default; border-style:dashed;}
#form .kinpair{display:flex; gap:10px; margin-bottom:4px;}
#form .kinpair > div{flex:1; min-width:0;}
#form .kinlist{margin:-4px 0 8px;}
#form .kinlist button{
  display:block; width:100%; text-align:left; cursor:pointer;
  padding:6px 9px; margin-bottom:3px; border-radius:8px;
  background:var(--pod-hi); border:1px solid var(--pod-edge); color:var(--ink);
  font-family:'Fraunces',Georgia,serif; font-size:13px;
}
#form .kinlist button:hover{border-color:var(--gold);}
#form .kinlist button small{
  display:block; font-family:'Karla',sans-serif; font-size:10px;
  color:var(--muted); margin-top:1px;
}
#form .relline.none{background:var(--pod-hi); color:var(--ink); border:1.5px dashed var(--pod-edge);}
#form .relline.none b{color:var(--muted);}
#form .covbar{
  height:7px; border-radius:99px; background:var(--pod-hi);
  border:1px solid var(--pod-edge); overflow:hidden; margin-bottom:6px;
}
#form .covbar i{display:block; height:100%; background:var(--leaf);}
#form .covnote{margin:0 0 8px; font-size:11.5px; color:var(--muted); line-height:1.5;}
#form .covnote b{color:var(--ink);}
#form .gaps{margin-bottom:4px;}
#form .gaprow{
  display:flex; gap:10px; align-items:baseline; padding:6px 0;
  border-top:1px solid var(--pod-edge); font-size:11.5px;
}
#form .gaprow b{color:var(--gold); font-size:14px; min-width:34px; font-variant-numeric:tabular-nums;}
#form .gaprow span{color:var(--ink); line-height:1.45;}
#form .gaprow em{display:block; font-style:normal; color:var(--muted); font-size:10.5px;}
#form .askrow{
  display:flex; align-items:center; gap:8px; width:100%; cursor:pointer;
  padding:7px 10px; margin-bottom:5px; border-radius:10px;
  background:var(--pod-hi); border:1px solid var(--pod-edge); color:var(--ink); text-align:left;
}
#form .askrow:hover{border-color:var(--gold);}
#form .askrow u{flex:1; text-decoration:none; font-family:'Fraunces',Georgia,serif; font-size:13.5px;}
#form .askrow u small{display:block; font-family:'Karla',sans-serif; font-size:10px; color:var(--muted);}
#form .askrow em{font-style:normal; font-size:10.5px; font-weight:700; color:var(--gold); white-space:nowrap;}
#form .warn{
  margin:0 0 10px; padding:8px 11px; border-radius:10px;
  background:rgba(156,97,25,.1); border:1px solid var(--gold-soft);
  color:var(--ink); font-size:11.5px; line-height:1.45;
}

/* the review panel */
#form.wide{width:min(420px, calc(100vw - 32px));}
#form .pair{
  padding:11px; margin-bottom:9px; border-radius:14px 4px 14px 4px;
  background:var(--pod-hi); border:1.5px solid var(--pod-edge);
}
#form .pair .two{display:flex; gap:8px; margin-bottom:8px;}
#form .pair .two button{
  flex:1; padding:9px; border-radius:10px; cursor:pointer; text-align:left;
  background:var(--pod); border:1.5px solid var(--pod-edge); color:var(--ink);
  font-family:'Fraunces',Georgia,serif; font-size:14px;
}
#form .pair .two button:hover{border-color:var(--gold);}
#form .pair .two button small{
  display:block; font-family:'Karla',sans-serif; font-size:10px;
  color:var(--muted); margin-top:2px;
}
#form .pair p{margin:0 0 8px; font-size:11px; line-height:1.45; color:var(--muted);}
#form .pair .keepnote{
  font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--gold);
  font-weight:700; margin-bottom:7px;
}
#form .pair .keepnote span{
  display:block; color:var(--muted); font-weight:600; margin-top:3px;
}
#form .pair.weak{border-style:dashed;}
#form .pair.weak .keepnote{color:var(--muted);}
#form .pair .against{color:var(--muted); font-style:italic;}
.btn.ghost.on{background:var(--leaf); border-color:var(--leaf); color:var(--sky);}
#form .lbl{
  font-size:10px; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muted); margin:2px 0 6px;
}
.fld{
  width:100%; padding:9px 11px; margin-bottom:8px;
  background:var(--pod-hi); border:1.5px solid var(--pod-edge); border-radius:9px;
  color:var(--ink); font-family:'Karla',sans-serif; font-size:15px;
}
.fld:focus{outline:none; border-color:var(--gold);}
.fld::placeholder{color:var(--muted); opacity:.8;}
.seg{display:flex; gap:5px; margin-bottom:10px;}
.seg button{
  flex:1; padding:7px 0; border-radius:8px; cursor:pointer;
  background:transparent; border:1.5px solid var(--pod-edge); color:var(--muted);
  font-family:'Karla',sans-serif; font-size:12px; font-weight:600;
}
.seg button[aria-pressed="true"]{background:var(--gold); border-color:var(--gold); color:var(--pod);}
.row{display:flex; gap:7px;}
.btn{
  flex:1; padding:9px 0; border-radius:9px; cursor:pointer;
  font-family:'Karla',sans-serif; font-size:13px; font-weight:700; letter-spacing:.03em;
  background:var(--gold); border:1.5px solid var(--gold); color:var(--pod);
}
.btn.ghost{background:transparent; color:var(--muted); border-color:var(--pod-edge); flex:0 0 76px;}
.btn:hover{background:var(--gold-soft); border-color:var(--gold-soft);}
.btn.ghost:hover{background:transparent; color:var(--ink); border-color:var(--muted);}

/* ── first run ──────────────────────────────────────────────────────── */
#seed{
  position:fixed; left:50%; top:50%; transform:translate(-50%,-50%);
  width:min(430px,calc(100vw - 36px)); text-align:center; z-index:50;
}
#seed h1{
  font-family:'Fraunces',Georgia,serif; font-weight:600; font-size:clamp(31px,6vw,46px);
  margin:0 0 8px; letter-spacing:.01em;
}
#seed h1 em{font-style:normal; color:var(--gold);}
#seed p{color:var(--muted); font-size:15px; line-height:1.6; margin:0 auto 22px; max-width:34ch;}
#seed .box{
  padding:18px; border-radius:26px 8px 26px 8px;
  background:var(--pod); border:1.5px solid var(--pod-edge); box-shadow:var(--lift);
  text-align:left;
}

<div id="live" class="sr" aria-live="polite"></div>

<script>
/* ════════════════════════════════════════════════════════════════════════
   The Baobab Project — a Shona family tree.

   The model is deliberately small. People sit in unions; a union is one or
   two partners plus their children. Everything else the tree knows how to
   say — siblings, grandparents, cousins — falls out of those two facts,
   which is why naming one person in relation to somebody instantly wires up
   the rest of their connections.

     person : { id, name, sex:'f'|'m'|'', totem }
     union  : { id, partners:[personId], children:[personId] }

   Generation 0 is whoever was planted first. Ancestors count downward and
   are drawn below the horizon as roots; descendants count upward into the
   canopy. Nothing in the layout needs to know which is which — it lays out
   one forest and the horizon does the rest.
   ═══════════════════════════════════════════════════════════════════════ */

const KEY = 'muti-baobab-v1';

const POD_W = 132, POD_H = 48;
const COUPLE_GAP = 30;     // between two partners
const SIB_GAP = 46;        // between sibling families
const LEVEL = 172;         // between generations

let state = { people:{}, unions:{}, rootId:null, seq:1 };
let history = [];
let sel = null;
let pending = null;
let pos = { x:0, y:0, k:1 };
let layout = { persons:{}, blocks:[], links:[] };
let fresh = new Set();
let budSig = '';                    // which buds are currently on screen
let meId = null;                    // who is looking — this device only
let pickingMe = false;

const $ = id => document.getElementById(id);
const stage = $('stage'), gtree = $('gtree'), podsEl = $('pods');

/* ── model ──────────────────────────────────────────────────────────── */
const uid = p => p + (state.seq++);
const people = () => Object.values(state.people);
const unions = () => Object.values(state.unions);

const parentUnionOf = id => unions().find(u => u.children.includes(id)) || null;
const unionsOf = id => unions().filter(u => u.partners.includes(id));
const partnersOf = id => unionsOf(id).flatMap(u => u.partners.filter(p => p !== id && state.people[p]));

// Where somebody sits among their brothers and sisters, eldest first.
const birthRank = id => {
  const pu = parentUnionOf(id);
  return pu ? pu.children.indexOf(id) : -1;
};
const sibCount = id => {
  const pu = parentUnionOf(id);
  return pu ? pu.children.length : 1;
};

function addPerson(name, sex, totem, born, died){
  const id = uid('p');
  state.people[id] = {
    id, name:name.trim(), sex:sex || '', totem:(totem || '').trim(),
    born:(born || '').trim(), died:(died || '').trim(), root:false
  };
  fresh.add(id);
  return id;
}

/* Marking somebody as the root of the line says "this is as far back as we
   can trace" — the tree stops asking for their parents and draws them as the
   taproot everything else grows from. */
function toggleRoot(id){
  const p = state.people[id];
  if (!p) return;
  snapshot();
  p.root = !p.root;
}
function addUnion(partners, children){
  const id = uid('u');
  state.unions[id] = { id, partners:partners.slice(), children:children.slice() };
  return state.unions[id];
}
function snapshot(){
  history.push(JSON.stringify(state));
  if (history.length > 50) history.shift();
}

/* Grow a new person off an existing one. Each branch also creates the
   connections the new person implies — a sibling inherits your parents, a
   child gets both of yours — so they can branch out immediately themselves.

   opts.position  'older' | 'younger'  where a new sibling lands in the row
   opts.unionId   which marriage a new child belongs to, when there are several */
function grow(kind, anchorId, name, sex, totem, opts){
  opts = opts || {};
  snapshot();
  const id = addPerson(name, sex, totem, opts.born, opts.died);

  if (kind === 'parent'){
    const pu = parentUnionOf(anchorId);
    if (pu) pu.partners.push(id);          // joins the union, so gains every sibling
    else addUnion([id], [anchorId]);
  }
  else if (kind === 'sibling'){
    const pu = parentUnionOf(anchorId) || addUnion([], [anchorId]);
    const at = pu.children.indexOf(anchorId);
    pu.children.splice(opts.position === 'older' ? at : at + 1, 0, id);
  }
  else if (kind === 'partner'){
    // fill a marriage that only has one name in it, otherwise start a new one
    const solo = unionsOf(anchorId).find(u => u.partners.length === 1);
    if (solo) solo.partners.push(id);
    else addUnion([anchorId, id], []);
  }
  else if (kind === 'child'){
    let u = opts.unionId ? state.unions[opts.unionId] : null;
    if (!u || !u.partners.includes(anchorId)) u = unionsOf(anchorId)[0];
    if (!u) u = addUnion([anchorId], []);
    u.children.push(id);                   // newest is youngest
  }
  return id;
}

/* Move somebody one place among their brothers and sisters. */
function reorder(id, dir){
  const pu = parentUnionOf(id);
  if (!pu) return;
  const at = pu.children.indexOf(id), to = at + dir;
  if (at < 0 || to < 0 || to >= pu.children.length) return;
  snapshot();
  pu.children.splice(at, 1);
  pu.children.splice(to, 0, id);
}

function removePerson(id){
  snapshot();
  delete state.people[id];
  for (const u of unions()){
    u.partners = u.partners.filter(p => p !== id);
    u.children = u.children.filter(c => c !== id);
    const pointless = (!u.partners.length && u.children.length < 2) ||
                      (u.partners.length <= 1 && !u.children.length);
    if (pointless) delete state.unions[u.id];
  }
  if (state.rootId === id) state.rootId = people().length ? people()[0].id : null;
}

/* ── the same person, entered twice ─────────────────────────────────────
   A dozen relatives filling one tree from different directions will meet in
   the middle, and when they do the same grandfather gets typed twice. Titles
   make it harder to spot: one person enters "Sekuru Garikai", another enters
   "Garikai Chirwa", and nothing matches on the surface.

   So names are stripped of the kin titles people naturally attach before
   they are compared, and the evidence around each name — birth years, sex,
   who their parents are — is weighed for and against. */

const TITLES = new Set([
  'sekuru','tateguru','ambuya','mbuya','gogo','baba','babamukuru','babamunini',
  'amai','mai','mainini','maiguru','tete','vatete','mudhara','mukoma','muninina',
  'sisi','bhudhi','va','mr','mrs','ms','dr','the','late'
]);

function nameTokens(name){
  return String(name || '')
    .toLowerCase()
    .replace(/['’.]/g, '')
    .replace(/[^a-z0-9\s-]/g, ' ')
    .split(/[\s-]+/)
    .filter(t => t && !TITLES.has(t));
}

function editDistance(a, b){
  if (a === b) return 0;
  if (!a.length || !b.length) return Math.max(a.length, b.length);
  let prev = Array.from({ length:b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const row = [i];
    for (let j = 1; j <= b.length; j++){
      row[j] = Math.min(prev[j] + 1, row[j - 1] + 1, prev[j - 1] + (a[i-1] === b[j-1] ? 0 : 1));
    }
    prev = row;
  }
  return prev[b.length];
}

const closeEnough = (a, b) => {
  if (a === b) return true;
  const d = editDistance(a, b);
  return a.length >= 4 && b.length >= 4 && d <= (Math.min(a.length, b.length) >= 7 ? 2 : 1);
};

/* Two people cannot be the same if the tree already says they are related. */
function mustBeDifferent(a, b){
  if (a === b) return true;
  if (partnersOf(a).includes(b)) return true;
  const up = ancestry(a).up, down = ancestry(b).up;
  if (up.has(b) || down.has(a)) return true;
  const pu = parentUnionOf(a);
  return false;
}

/* How alike are two names, once titles are set aside? This is only ever the
   opening question. */
function nameSimilarity(nameA, nameB){
  const ta = nameTokens(nameA), tb = nameTokens(nameB);
  if (!ta.length || !tb.length) return null;
  const shared = ta.filter(x => tb.some(y => closeEnough(x, y)));
  if (!shared.length) return null;
  if (ta.join(' ') === tb.join(' ')) return { score:0.34, why:'same name once the title is set aside' };
  if (shared.length >= Math.min(ta.length, tb.length)) return { score:0.28, why:`both called ${shared.join(' ')}` };
  return { score:0.18, why:`share the name ${shared.join(' ')}` };
}

/* Where somebody sits, in a phrase — enough to tell one Tendai from another. */
function positionOf(id){
  const bits = [];
  const mates = partnersOf(id);
  if (mates.length) bits.push(`married to ${state.people[mates[0]].name}`);
  const par = parentsOf(id);
  if (par.length) bits.push(`child of ${par.map(x => state.people[x].name).join(' and ')}`);
  const kids = unionsOf(id).flatMap(u => u.children).filter(k => state.people[k]);
  if (kids.length) bits.push(`parent of ${state.people[kids[0]].name}${kids.length > 1 ? ` and ${kids.length - 1} more` : ''}`);
  return bits.slice(0, 2).join(' · ') || 'not connected to anyone yet';
}

/* Are these two records one person?

   A shared name is where this starts, never where it ends. Families name
   children after their grandparents, and two cousins called Tendai are two
   people. So the name only opens the question and the tree's own shape
   answers it: sharing a husband or wife, a child, or a set of parents is
   what makes two records one person, and standing a generation apart or
   having different parents recorded is what keeps them separate. */
function sameness(aId, bId, gens){
  const a = state.people[aId], b = state.people[bId];
  if (!a || !b || mustBeDifferent(aId, bId)) return null;

  const nm = nameSimilarity(a.name, b.name);
  if (!nm) return null;

  const why = [nm.why];
  const against = [];
  let score = nm.score;

  // ── generation ────────────────────────────────────────────────────────
  const g = gens || generations();
  if (g[aId] !== undefined && g[bId] !== undefined){
    const d = Math.abs(g[aId] - g[bId]);
    if (d === 0) score += 0.08;
    else {
      score -= Math.min(0.8, 0.45 * d);
      against.push(d === 1 ? 'one generation apart — more likely named after them'
                           : `${d} generations apart`);
    }
  }

  // ── who they are married to ───────────────────────────────────────────
  const mates = partnersOf(aId), theirs = partnersOf(bId);
  const sharedMate = mates.filter(x => theirs.includes(x));
  if (sharedMate.length){
    score += 0.5; why.push(`both married to ${state.people[sharedMate[0]].name}`);
  } else if (mates.length && theirs.length){
    score -= 0.18; against.push('married to different people');
  }

  // ── whose children they are parents of ────────────────────────────────
  const kidsA = unionsOf(aId).flatMap(u => u.children);
  const kidsB = unionsOf(bId).flatMap(u => u.children);
  const sharedKid = kidsA.filter(k => kidsB.includes(k));
  if (sharedKid.length){
    score += 0.5; why.push(`both parents of ${state.people[sharedKid[0]].name}`);
  } else if (kidsA.length && kidsB.length){
    score -= 0.12; against.push('different children recorded');
  }

  // ── whose children they are ───────────────────────────────────────────
  const pa = parentUnionOf(aId), pb = parentUnionOf(bId);
  if (pa && pb){
    const setA = pa.partners.slice().sort().join(), setB = pb.partners.slice().sort().join();
    if (pa.id === pb.id){ score += 0.4; why.push('listed twice among the same children'); }
    else if (setA && setA === setB){ score += 0.4; why.push('the same parents'); }
    else {
      score -= 0.4;
      against.push('different parents recorded — if those two are also one person, merge them first');
    }
  }

  // ── the smaller corroborations ────────────────────────────────────────
  const ya = birthYear(aId), yb = birthYear(bId);
  if (ya && yb){
    if (ya === yb){ score += 0.2; why.push(`both born ${ya}`); }
    else if (Math.abs(ya - yb) > 2){ score -= 0.55; against.push(`born ${ya} and ${yb}`); }
  }
  if (a.sex && b.sex && a.sex !== b.sex){ score -= 0.6; against.push('recorded as different sexes'); }
  if (a.totem && b.totem && a.totem.toLowerCase() === b.totem.toLowerCase()){
    score += 0.12; why.push(`same totem, ${a.totem}`);
  }

  return {
    score: Math.max(0, Math.min(1, score)),
    why, against,
    // a name on its own never gets past "possible"
    strong: sharedMate.length > 0 || sharedKid.length > 0 || (pa && pb && pa.id === pb.id)
  };
}

const dismissedKey = (a, b) => [a, b].sort().join('|');
const isDismissed = (a, b) =>
  (state.notDuplicates || []).includes(dismissedKey(a, b));

/* Every pair worth a second look, strongest first. Generations are worked
   out once and handed round — otherwise this walks the whole tree for every
   pair it considers. */
function duplicatePairs(threshold){
  const ids = people().map(p => p.id);
  const gens = generations();
  const out = [];
  for (let i = 0; i < ids.length; i++) for (let j = i + 1; j < ids.length; j++){
    if (isDismissed(ids[i], ids[j])) continue;
    const m = sameness(ids[i], ids[j], gens);
    if (m && m.score >= (threshold ?? 0.5)) out.push({ a:ids[i], b:ids[j], ...m });
  }
  return out.sort((x, y) => y.score - x.score);
}
const likelyDuplicates = () => duplicatePairs().filter(d => d.strong || d.score >= 0.75);

/* Candidates for a name being typed into the form. */
function matchesForName(name, excludeId){
  if (nameTokens(name).length === 0 || name.trim().length < 3) return [];
  // Nothing is known about a name being typed except the name, so these are
  // offered by name alone — which is why each one is shown with where they
  // sit in the family, for you to judge rather than the tree.
  return people()
    .filter(p => p.id !== excludeId)
    .map(p => ({ id:p.id, m:nameSimilarity(name, p.name) }))
    .filter(x => x.m)
    .sort((x, y) => y.m.score - x.m.score)
    .slice(0, 3);
}

/* ── Shona kinship ──────────────────────────────────────────────────────
   Shona kinship is classificatory: it sorts relatives by generation, by side
   of the family and by seniority rather than naming each exact biological
   link. Two consequences drive everything below.

   PARALLEL relatives fold into the direct line. Your father's brothers are
   fathers to you — Babamukuru if senior to him, Babamunini if junior — your
   mother's sisters are mothers, and the children of all of them are your
   brothers and sisters. There is no word for cousin because there is no such
   category.

   CROSS relatives skew sideways instead. Your father's sister is Tete, your
   mother's brother is Sekuru, and the skew runs on down their lines: a
   mother's-brother's descendants keep being Sekuru to you, and a
   father's-sister's descendants keep being Muzukuru.

   Families differ on the details — notably whether seniority among cousins
   follows the parents' birth order or the children's own ages. This family
   goes by the children's own ages, so telling Mukoma from Munin'ina across
   two households needs both birth years. Without them the tree says so
   plainly rather than guessing, and it always shows its working. */

function parentsOf(id){
  const u = parentUnionOf(id);
  return u ? u.partners.filter(x => state.people[x]) : [];
}

/* Everybody above somebody, with how many generations up they sit, plus the
   unions along the way — those are where two people's lines meet.
 
   Memoised. One relationship needs two of these walks, and the coverage scan
   asks for thousands of relationships; without the cache it re-walks the tree
   from scratch every time. Cleared whenever the tree changes, which is what
   render() marks. */
const ancestryCache = new Map();
function ancestry(id){
  const hit = ancestryCache.get(id);
  if (hit) return hit;
  const out = computeAncestry(id);
  ancestryCache.set(id, out);
  return out;
}
function computeAncestry(id){
  const up = new Map([[id, 0]]);
  const joins = [];                       // { union, child, up } — child is on this path
  let frontier = [{ id, up:0 }];
  const seen = new Set([id]);
  let guard = 0;
  while (frontier.length && guard++ < 200){
    const next = [];
    for (const f of frontier){
      const u = parentUnionOf(f.id);
      if (!u) continue;
      joins.push({ union:u, child:f.id, up:f.up });
      for (const par of u.partners){
        if (!state.people[par] || seen.has(par)) continue;
        seen.add(par);
        up.set(par, f.up + 1);
        next.push({ id:par, up:f.up + 1 });
      }
    }
    frontier = next;
  }
  return { up, joins };
}

const SIB = (mine, theirs, older) => {
  if (!mine || !theirs) return null;                 // need both to know which word
  if (mine !== theirs) return 'Hanzvadzi';           // opposite sex needs no seniority
  if (older === null) return null;                   // same sex, and nobody knows who is older
  return older ? 'Mukoma' : "Munin'ina";
};

/* A birth year out of whatever was typed — "1968", "12 Mar 1968", "c.1930". */
function birthYear(id){
  const p = state.people[id];
  const m = p && p.born && String(p.born).match(/\b(1[0-9]{3}|20[0-9]{2})\b/);
  return m ? Number(m[1]) : null;
}

/* Is `a` older than `b`, or null when there is no way to tell?

   Brothers and sisters of one household are ranked by the row itself, which
   is arranged by hand. Everyone else — the children of two brothers, say —
   is ranked by their own birth dates, because that is how this family counts
   seniority. No dates, no answer. */
function olderThan(a, b){
  const ua = parentUnionOf(a), ub = parentUnionOf(b);
  if (ua && ub && ua.id === ub.id) return birthRank(a) < birthRank(b);
  const ya = birthYear(a), yb = birthYear(b);
  if (ya === null || yb === null) return null;
  if (ya !== yb) return ya < yb;
  const da = Date.parse(state.people[a].born), db = Date.parse(state.people[b].born);
  if (!isNaN(da) && !isNaN(db) && da !== db) return da < db;
  return null;                                       // same year, no finer detail
}
const possess = id => {
  const p = state.people[id];
  return p ? p.name : 'them';
};

/* The term for `tid` as seen by `who`, with the trace that produced it. */
function relationship(who, tid, byBloodOnly){
  if (!who || !tid || !state.people[who] || !state.people[tid]) return null;
  if (who === tid) return { term:'You', why:'this is you' };

  const me = state.people[who], them = state.people[tid];

  // married to each other
  if (partnersOf(who).includes(tid)){
    return { term: them.sex === 'f' ? 'Mukadzi' : them.sex === 'm' ? 'Murume' : null,
             why:'your husband or wife' };
  }

  const mine = ancestry(who), theirs = ancestry(tid);

  // straight up or straight down the same line
  if (mine.up.has(tid)){
    const n = mine.up.get(tid);
    if (n === 1) return { term: them.sex === 'f' ? 'Amai' : them.sex === 'm' ? 'Baba' : null,
                          why:'your mother or father' };
    return { term: them.sex === 'f' ? 'Ambuya' : them.sex === 'm' ? 'Sekuru' : null,
             why:n === 2 ? 'your grandparent' : `your ancestor, ${n} generations back` };
  }
  if (theirs.up.has(who)){
    const n = theirs.up.get(who);
    if (n === 1) return { term: them.sex === 'f' ? 'Mwanasikana' : them.sex === 'm' ? 'Mwanakomana' : null,
                          why:'your child' };
    return { term:'Muzukuru', why:n === 2 ? 'your grandchild' : `your descendant, ${n} generations down` };
  }

  // where the two lines meet: the nearest union both descend from
  let best = null;
  for (const a of mine.joins) for (const b of theirs.joins){
    if (a.union.id !== b.union.id || a.child === b.child) continue;
    const cost = a.up + b.up;
    if (!best || cost < best.cost) best = { cost, myUp:a.up, tgUp:b.up, myLink:a.child, tgLink:b.child };
  }

  if (best){
    const myLink = state.people[best.myLink], tgLink = state.people[best.tgLink];
    const genDiff = best.myUp - best.tgUp;            // >0 means they are above me
    const known = myLink.sex && tgLink.sex;
    const cross = best.myUp >= 1 && known && myLink.sex !== tgLink.sex;
    const senior = olderThan(best.tgLink, best.myLink);   // two siblings: always answerable
    const via = best.myUp === 1
      ? (myLink.sex === 'f' ? "your mother's" : myLink.sex === 'm' ? "your father's" : "your parent's")
      : `your ancestor ${myLink.name}'s`;

    if (cross){
      // Tete's line and Sekuru's line, and the skew that runs down them
      const motherBrother = myLink.sex === 'f' && tgLink.sex === 'm';
      if (genDiff >= 2) return { term: them.sex === 'f' ? 'Ambuya' : 'Sekuru',
                                 why:`${via} family, two generations above you` };
      if (genDiff === 1) return motherBrother
        ? { term:'Sekuru', why:`${via} brother` }
        : { term:'Tete', why:`${via} sister` };
      return motherBrother
        ? { term:'Sekuru', why:`descended from ${via} brother — that line stays Sekuru` }
        : { term:'Muzukuru', why:`descended from ${via} sister — that line stays Muzukuru` };
    }

    // parallel: the line folds back into your own
    if (genDiff >= 2) return { term: them.sex === 'f' ? 'Ambuya' : them.sex === 'm' ? 'Sekuru' : null,
                               why:'two generations above you' };
    if (genDiff === 1){
      if (them.sex === 'm') return { term: senior ? 'Babamukuru' : 'Babamunini',
                                     why:`${via} ${senior ? 'older' : 'younger'} brother` };
      if (them.sex === 'f') return { term: senior ? 'Amaiguru' : 'Amainini',
                                     why:`${via} ${senior ? 'older' : 'younger'} sister` };
      return { term:null, why:`${via} sibling` };
    }
    if (genDiff === 0){
      const sameParents = best.myUp === 0 && best.tgUp === 0;
      const older = olderThan(tid, who);
      const t = SIB(me.sex, them.sex, older);
      if (sameParents){
        return { term:t, why:`your ${older ? 'older' : 'younger'} brother or sister` };
      }
      const base = `${via} side — a brother or sister to you, not a cousin`;
      const needsAge = !t && me.sex && them.sex && me.sex === them.sex;
      // Naming both candidates is more use than saying nothing: it shows the
      // word is one of two and that a birth year is all that's missing.
      return needsAge
        ? { term:null, choice:"Mukoma or Munin'ina",
            why:`${base} — add both birth years to say which` }
        : { term:t, why:base };
    }
    return { term:'Muzukuru', why:`${via} side, ${-genDiff} generation${genDiff === -1 ? '' : 's'} below you` };
  }

  // no blood link — try the marriages, but only one hop, or two people
  // married to each other would send this bouncing back and forth forever
  if (!byBloodOnly){
    const spouseTerm = marriedIn(who, tid);
    if (spouseTerm) return spouseTerm;
  }
  return { term:null, why:'no traced link yet — add the people in between' };
}

/* Relatives by marriage. Only the terms the family already uses are named;
   anything else is described rather than invented. */
function marriedIn(who, tid){
  const them = state.people[tid];

  // through your own husband or wife
  for (const sp of partnersOf(who)){
    const r = relationship(sp, tid, true);
    if (!r || !r.term) continue;
    const spouse = state.people[sp];
    if (spouse.sex === 'f' && r.why && r.why.includes('brother or sister')){
      if (them.sex === 'm') return { term:'Tsano', why:"your wife's brother" };
      if (them.sex === 'f') return { term:'Muramu', why:"your wife's sister" };
    }
    return { term:null, why:`married into the family — ${spouse.name}'s ${r.term}` };
  }

  // married to one of yours
  for (const sp of partnersOf(tid)){
    const r = relationship(who, sp, true);
    if (!r) continue;
    if (r.why === 'your child'){
      if (them.sex === 'f') return { term:'Muroora', why:"your son's or daughter's wife" };
      if (them.sex === 'm') return { term:'Mukuwasha', why:"your daughter's or son's husband" };
    }
    if (r.term) return { term:null, why:`married to your ${r.term} (${possess(sp)})` };
  }
  return null;
}

/* Attach somebody already in the tree instead of typing them again. This is
   what actually stops duplicates: the moment two branches meet, one of them
   points at the person the other already entered. */
function canLink(kind, anchorId, otherId){
  if (anchorId === otherId) return 'that is the same person';
  const up = ancestry(anchorId).up, down = ancestry(otherId).up;
  if (kind === 'parent'){
    if (down.has(anchorId)) return 'that would make them their own ancestor';
    const pu = parentUnionOf(anchorId);
    if (pu && pu.partners.includes(otherId)) return 'already recorded as a parent here';
    if (pu && pu.partners.length >= 2) return 'both parents are already named';
  }
  if (kind === 'child'){
    if (up.has(otherId)) return 'that would make them their own descendant';
    const pu = parentUnionOf(otherId);
    if (pu) return `${state.people[otherId].name} already has parents recorded — merge the two records instead`;
  }
  if (kind === 'sibling'){
    const pu = parentUnionOf(otherId);
    const mine = parentUnionOf(anchorId);
    if (pu && mine && pu.id !== mine.id) return `${state.people[otherId].name} already has different parents recorded`;
    if (up.has(otherId) || down.has(anchorId)) return 'they are already an ancestor or descendant here';
  }
  if (kind === 'partner'){
    if (partnersOf(anchorId).includes(otherId)) return 'already married to each other';
    if (up.has(otherId) || down.has(anchorId)) return 'they are already an ancestor or descendant here';
  }
  return null;
}

function linkExisting(kind, anchorId, otherId){
  snapshot();
  if (kind === 'parent'){
    const pu = parentUnionOf(anchorId);
    if (pu) pu.partners.push(otherId); else addUnion([otherId], [anchorId]);
  } else if (kind === 'sibling'){
    const pu = parentUnionOf(anchorId) || addUnion([], [anchorId]);
    if (!pu.children.includes(otherId)){
      const at = pu.children.indexOf(anchorId);
      pu.children.splice(at + 1, 0, otherId);
    }
  } else if (kind === 'partner'){
    const solo = unionsOf(anchorId).find(u => u.partners.length === 1);
    if (solo) solo.partners.push(otherId); else addUnion([anchorId, otherId], []);
  } else if (kind === 'child'){
    const u = unionsOf(anchorId)[0] || addUnion([anchorId], []);
    if (!u.children.includes(otherId)) u.children.push(otherId);
  }
}

/* Fold `loser` into `keeper`: every marriage, every child list, and any
   detail the kept record was missing. */
function mergePeople(keeperId, loserId){
  const keeper = state.people[keeperId], loser = state.people[loserId];
  if (!keeper || !loser || keeperId === loserId) return;
  snapshot();

  for (const f of ['sex', 'totem', 'born', 'died']){
    if (!keeper[f] && loser[f]) keeper[f] = loser[f];
  }
  if (loser.root) keeper.root = true;
  if (loser.name.length > keeper.name.length) keeper.name = loser.name;

  const keeperParents = parentUnionOf(keeperId);
  for (const u of unions()){
    u.partners = [...new Set(u.partners.map(x => x === loserId ? keeperId : x))];
    if (u.children.includes(loserId)){
      // one person has one set of parents; the kept record's win
      if (keeperParents && u.id !== keeperParents.id) u.children = u.children.filter(c => c !== loserId);
      else u.children = [...new Set(u.children.map(c => c === loserId ? keeperId : c))];
    }
  }
  delete state.people[loserId];
  for (const u of unions()){
    const dead = !u.partners.length && u.children.length < 2;
    if (dead) delete state.unions[u.id];
  }
  if (state.rootId === loserId) state.rootId = keeperId;
  if (meId === loserId) setMe(keeperId);
  state.notDuplicates = (state.notDuplicates || []).filter(k => !k.includes(loserId));
}

function dismissDuplicate(a, b){
  snapshot();
  state.notDuplicates = state.notDuplicates || [];
  const k = dismissedKey(a, b);
  if (!state.notDuplicates.includes(k)) state.notDuplicates.push(k);
}

/* ── generations ────────────────────────────────────────────────────── */
function generations(){
  const g = {};
  if (!state.rootId || !state.people[state.rootId]) return g;
  const q = [state.rootId]; g[state.rootId] = 0;
  const step = (other, gen) => {
    if (other && state.people[other] && g[other] === undefined){ g[other] = gen; q.push(other); }
  };
  while (q.length){
    const id = q.shift(), n = g[id];
    const pu = parentUnionOf(id);
    if (pu){
      pu.partners.forEach(p => step(p, n - 1));
      pu.children.forEach(c => step(c, n));
    }
    for (const u of unions()){
      if (!u.partners.includes(id)) continue;
      u.partners.forEach(p => step(p, n));
      u.children.forEach(c => step(c, n + 1));
    }
  }
  people().forEach(p => { if (g[p.id] === undefined) g[p.id] = 0; });
  return g;
}

/* ── layout ─────────────────────────────────────────────────────────────
   Blocks are what moves. A block is a row of people joined by marriage —
   usually a couple, but somebody who married more than once sits in the
   middle of their partners, so one row can read  Chipo — Tendai — Rudo.
   Each marriage in the row has its own point on the ground, and its own
   children hang from it, eldest on the left.

   Every block hangs off at most one parent block, so the family is still a
   forest and one tidy-tree pass places it. */
function computeLayout(){
  const g = generations();
  const blocks = [], ofPerson = {};
  const width = b => b.socket ? 112 : b.members.length * POD_W + (b.members.length - 1) * COUPLE_GAP;

  // Walk the marriage graph so everybody who married into a row stands in it.
  const adj = {};
  for (const u of unions()){
    if (u.partners.length !== 2) continue;
    const [x, y] = u.partners;
    if (!state.people[x] || !state.people[y]) continue;
    (adj[x] = adj[x] || []).push(y);
    (adj[y] = adj[y] || []).push(x);
  }
  const seen = new Set();
  const chainFrom = start => {                  // depth-first, so A–X–B–C reads in order
    const order = [], stack = [start];
    while (stack.length){
      const n = stack.pop();
      if (seen.has(n)) continue;
      seen.add(n); order.push(n);
      (adj[n] || []).slice().reverse().forEach(m => { if (!seen.has(m)) stack.push(m); });
    }
    return order;
  };

  for (const p of people()){
    if (seen.has(p.id)) continue;
    // start at an end of the row when there is one, so nobody is stranded
    const ends = (adj[p.id] || []).length === 1 ? p.id
      : ((adj[p.id] || []).find(m => (adj[m] || []).length === 1) || p.id);
    const members = chainFrom(ends);
    const b = { id:'b' + blocks.length, members, gen:g[members[0]] ?? 0, x:0, kids:[], parent:null, unions:[] };
    members.forEach(m => ofPerson[m] = b);
    blocks.push(b);
  }

  // Which marriages belong to which row, in the order they sit along it.
  for (const b of blocks){
    b.unions = unions()
      .filter(u => u.partners.length && u.partners.every(pp => b.members.includes(pp)))
      .sort((u1, u2) => Math.min(...u1.partners.map(x => b.members.indexOf(x))) -
                        Math.min(...u2.partners.map(x => b.members.indexOf(x))));
  }

  for (const b of blocks){
    for (const u of b.unions){
      for (const c of u.children){            // union.children is already eldest-first
        const cb = ofPerson[c];
        if (!cb || cb === b || cb.parent) continue;
        cb.parent = b; cb.viaChild = c; cb.viaUnion = u.id;
        b.kids.push(cb);
      }
    }
  }
  // Siblings whose parents nobody has named yet: stand an empty socket in
  // their place so they hang together and the gap is visible.
  for (const u of unions()){
    if (u.partners.length) continue;
    const kids = u.children.map(c => ofPerson[c]).filter(Boolean).filter(k => !k.parent);
    if (!kids.length) continue;
    const host = { id:'s' + u.id, socket:true, forChild:u.children[0], members:[],
                   gen:(g[u.children[0]] ?? 0) - 1, x:0, kids:[], parent:null, unions:[] };
    blocks.push(host);
    for (const kb of kids){ kb.parent = host; kb.viaChild = u.children.find(c => kb.members.includes(c)); host.kids.push(kb); }
  }

  function place(b, left){
    if (!b.kids.length){ b.x = left + width(b)/2; return width(b); }
    let cursor = left, span = 0;
    b.kids.forEach((k, i) => {
      const w = place(k, cursor);
      cursor += w + SIB_GAP;
      span += w + (i ? SIB_GAP : 0);
    });
    b.x = (b.kids[0].x + b.kids[b.kids.length - 1].x) / 2;
    const own = width(b);
    if (own > span){
      const shift = (own - span) / 2;
      const move = (n, d) => { n.x += d; n.kids.forEach(k => move(k, d)); };
      b.kids.forEach(k => move(k, shift));
      b.x = left + own/2;
      return own;
    }
    return span;
  }

  let cursor = 0;
  for (const b of blocks){
    if (b.parent) continue;
    cursor += place(b, cursor) + SIB_GAP * 2;
  }

  const persons = {}, sockets = [], links = [], unionAt = {};
  const countBelow = b => b.members.length + b.kids.reduce((n, k) => n + countBelow(k), 0);

  for (const b of blocks){
    b.y = -b.gen * LEVEL;
    if (b.socket){ sockets.push(b); continue; }
    b.members.forEach((m, i) => {
      persons[m] = { x:b.x - width(b)/2 + i*(POD_W + COUPLE_GAP) + POD_W/2, y:b.y };
    });
    for (const u of b.unions){
      const xs = u.partners.map(pp => persons[pp].x);
      const gap = u.partners.length === 2
        ? Math.abs(b.members.indexOf(u.partners[0]) - b.members.indexOf(u.partners[1])) : 1;
      // Children normally rise from halfway between their parents. When a
      // marriage reaches past somebody standing in between, that halfway point
      // lands on a stranger's pod — so hang them off the far partner instead,
      // where the tie arc still shows who the other parent is.
      const far = u.partners.slice().sort((x, y) => b.members.indexOf(y) - b.members.indexOf(x))[0];
      unionAt[u.id] = {
        x: gap > 1 ? persons[far].x : xs.reduce((t, v) => t + v, 0) / xs.length,
        y: b.y
      };
      if (u.partners.length === 2){
        links.push({ kind:'bond', x1:Math.min(...xs), x2:Math.max(...xs), y:b.y, reach:gap > 1 });
      }
    }
  }
  for (const b of blocks){
    if (!b.parent) continue;
    const to = persons[b.viaChild];
    if (!to) continue;
    const from = (b.viaUnion && unionAt[b.viaUnion]) || { x:b.parent.x, y:b.parent.y };
    links.push({
      kind:'branch', x1:from.x, y1:from.y, x2:to.x, y2:to.y,
      weight:countBelow(b), root:(from.y + to.y)/2 > 0,
      unknown:!!b.parent.socket, id:b.viaChild
    });
  }
  layout = { persons, sockets, links };
}

/* ── drawing ────────────────────────────────────────────────────────── */
function branchPath(l){
  const dy = l.y2 - l.y1, dx = l.x2 - l.x1;
  const c = Math.abs(dy) * 0.45, s = Math.sign(dy) || 1;
  // leaves the parent going straight and arrives at the child going straight,
  // which gives a fork the spring of a real branch instead of a wire.
  return `M${l.x1} ${l.y1} C ${l.x1 + dx*0.05} ${l.y1 + s*c}, ${l.x2 - dx*0.05} ${l.y2 - s*c}, ${l.x2} ${l.y2}`;
}

function render(){
  ancestryCache.clear();          // the tree may have changed shape
  computeLayout();

  const svg = [];
  for (const l of layout.links){
    if (l.kind === 'bond'){
      // Two partners standing next to each other get a short straight tie.
      // A second or third marriage reaches past whoever stands between them,
      // so that tie dips below the row instead of cutting through a pod.
      const d = l.reach
        ? `M${l.x1} ${l.y}q${(l.x2 - l.x1)/2} ${POD_H/2 + 26} ${l.x2 - l.x1} 0`
        : `M${l.x1} ${l.y}L${l.x2} ${l.y}`;
      svg.push(`<path class="bond${l.reach ? ' reach' : ''}" d="${d}"></path>`);
      continue;
    }
    if (l.unknown){
      svg.push(`<path class="branch unknown" d="${branchPath(l)}"></path>`);
      continue;
    }
    // A baobab is fattest where it meets the ground, then tapers fast. Swelling
    // the strokes near the horizon is what gives the whole thing its shape.
    const flare = 1 + 0.55 * Math.exp(-Math.abs((l.y1 + l.y2) / 2) / 150);
    const w = (l.root
      ? Math.max(2.5, Math.min(15, 2.5 + Math.sqrt(l.weight) * 1.9))
      : Math.max(3.5, Math.min(38, 3.5 + Math.sqrt(l.weight) * 3.8))) * flare;
    svg.push(`<path class="branch${l.root ? ' root' : ''}${fresh.has(l.id) ? ' grow' : ''}"` +
             ` stroke-width="${w.toFixed(1)}" d="${branchPath(l)}"></path>`);
  }
  gtree.innerHTML = svg.join('');

  const html = [];
  for (const s of layout.sockets){
    html.push(`<div class="pod socket" data-socket="${s.forChild}" tabindex="0" role="button"` +
              ` aria-label="Add the parents of these siblings"` +
              ` style="left:${s.x}px; top:${s.y}px"><span class="nm">+ Parents</span></div>`);
  }
  for (const p of people()){
    const at = layout.persons[p.id];
    if (!at) continue;
    const mark = p.sex === 'f' ? '♀' : p.sex === 'm' ? '♂' : '';
    const rank = rankLabel(p.id);
    const life = p.born || p.died ? (p.died ? `${p.born || '?'} – ${p.died}` : `b. ${p.born}`) : '';
    const badge = meId === p.id ? '<span class="badge">You</span>'
                : p.root ? '<span class="badge">Root of the line</span>' : '';
    html.push(
      `<div class="pod${sel === p.id ? ' sel' : ''}${fresh.has(p.id) ? ' sprout' : ''}` +
      `${p.root ? ' taproot' : ''}${meId === p.id ? ' you' : ''}"` +
      ` data-id="${p.id}" tabindex="0" role="button"` +
      ` aria-label="${esc(p.name)} — show where the tree can grow from here"` +
      ` style="left:${at.x}px; top:${at.y}px">` +
      badge +
      (mark ? `<span class="mk">${mark}</span>` : '') +
      `<span class="nm">${esc(p.name)}</span>` +
      (life ? `<span class="dates">${esc(life)}</span>` : '') +
      (p.totem ? `<span class="tot">${esc(p.totem)}</span>` : '') +
      (rank ? `<span class="rank">${rank}</span>` : '') +
      (sel === p.id ? ordControls(p.id) : '') +
      (sel === p.id ? `<span class="rm" data-card="${p.id}" role="button" tabindex="0"` +
        ` aria-label="Details for ${esc(p.name)}" style="left:-9px;right:auto;">⋯</span>` : '') +
      (sel === p.id ? `<span class="rm" data-rm="${p.id}" role="button" tabindex="0" aria-label="Remove ${esc(p.name)}">✕</span>` : '') +
      `</div>`);
  }
  podsEl.innerHTML = html.join('');

  $('count').textContent = people().length;
  updateWho();
  const likely = likelyDuplicates();
  const chip = $('dupes');
  chip.hidden = !likely.length;
  chip.textContent = likely.length === 1 ? '1 possible duplicate' : `${likely.length} possible duplicates`;
  $('bar').hidden = !people().length;
  $('hint').hidden = people().length === 0 || people().length > 4;
  $('seed').hidden = !!people().length;
  fresh.clear();
  applyTransform();
}

/* Eldest, then 2nd, 3rd… Only worth saying once there is more than one of
   them; a single child has no birth order to speak of. */
function rankLabel(id, always){
  const n = sibCount(id), i = birthRank(id);
  if (n < 2 || i < 0) return '';
  if (i === 0) return 'Eldest';
  if (i === n - 1) return 'Youngest';
  if (!always && sel !== id) return '';          // middles stay quiet until tapped
  return ['', '2nd', '3rd', '4th', '5th', '6th', '7th', '8th', '9th', '10th'][i] || (i + 1) + 'th';
}

function ordControls(id){
  const n = sibCount(id), i = birthRank(id);
  if (n < 2 || i < 0) return '';
  const btn = (dir, cls, glyph, label) =>
    `<span class="ord ${cls}" data-ord="${dir}" data-who="${id}" role="button"` +
    ` tabindex="0" aria-label="Move ${esc(state.people[id].name)} ${label}">${glyph}</span>`;
  return (i > 0     ? btn(-1, 'older', '‹', 'one place older') : '') +
         (i < n - 1 ? btn(1, 'younger', '›', 'one place younger') : '');
}

/* Where the tree can grow from whoever is selected.

   Buds are drawn in screen space at a fixed distance from the person, so they
   stay the same size and reach whatever the zoom. Each one takes the first
   spot on its preferred side that is on screen and lands on nobody — and then
   claims it, so the next bud has to find its own. That last part matters: two
   buds that pick the same spot look like one missing option. */
function placeBuds(){
  const layer = $('buds');
  if (!layer) return;
  if (!sel || !layout.persons[sel]){ layer.innerHTML = ''; budSig = ''; return; }

  const id = sel, at = layout.persons[id];
  const sx = q => q.x * pos.k + pos.x, sy = q => q.y * pos.k + pos.y;
  const cx = sx(at), cy = sy(at);

  const halfW = (POD_W / 2) * pos.k, halfH = (POD_H / 2) * pos.k;
  // Covering a person is bad; covering another bud is fatal, because the
  // hidden one looks like an option that simply isn't offered.
  const pods = Object.values(layout.persons).map(q => ({
    l:sx(q) - halfW - 6, r:sx(q) + halfW + 6,
    t:sy(q) - halfH - 14, b:sy(q) + halfH + 14
  })).concat((layout.sockets || []).map(q => ({
    l:sx(q) - 58 * pos.k, r:sx(q) + 58 * pos.k,
    t:sy(q) - 22 * pos.k, b:sy(q) + 22 * pos.k
  })));
  const placed = [];

  const RX = halfW + 96, RY = halfH + 60;
  const BW = 84, BH = 20;                     // half-extents of a bud
  const PAD = 10, BAR = innerHeight - 70;     // stay on screen, clear of the toolbar
  const boxOf = (x, y) => ({ l:x - BW, r:x + BW, t:y - BH, b:y + BH });
  const onScreen = (x, y) =>
    x - BW >= PAD && x + BW <= innerWidth - PAD && y - BH >= PAD && y + BH <= BAR;
  const overlaps = (k, list) => list.some(q => k.l < q.r && q.l < k.r && k.t < q.b && q.t < k.b);
  const RING = [0, -40, 40, -75, 75, -110, 110, -145, 145, 180, -90, 90];

  const place = pref => {
    const angles = pref.concat(RING.filter(a => !pref.includes(a)));
    let fallback = null, fewest = Infinity;
    for (const grow of [1, 1.3, 1.6, 2]){
      for (const a of angles){
        const r = a * Math.PI / 180;
        const x = cx + Math.cos(r) * RX * grow, y = cy + Math.sin(r) * RY * grow;
        if (!onScreen(x, y)) continue;
        const k = boxOf(x, y);
        if (overlaps(k, placed)) continue;              // never sit on another bud
        const n = pods.filter(q => k.l < q.r && q.l < k.r && k.t < q.b && q.t < k.b).length;
        if (n === 0){ placed.push(k); return [x, y]; }
        if (n < fewest){ fewest = n; fallback = [x, y]; }
      }
    }
    // Nothing on the ring was completely clear. Sitting over a name is
    // survivable — the bud is drawn above the tree and still takes the tap.
    // Sitting over another bud is not, so if the ring failed entirely, sweep
    // the screen for the nearest free spot rather than stacking.
    const spot = fallback || sweep();
    placed.push(boxOf(spot[0], spot[1]));
    return spot;
  };

  // Nearest point on a coarse grid that no other bud has taken.
  const sweep = () => {
    let best = null, nearest = Infinity;
    for (let y = PAD + BH; y <= BAR - BH; y += 34){
      for (let x = PAD + BW; x <= innerWidth - PAD - BW; x += 44){
        if (overlaps(boxOf(x, y), placed)) continue;
        const d = (x - cx) ** 2 + (y - cy) ** 2;
        if (d < nearest){ nearest = d; best = [x, y]; }
      }
    }
    return best || [Math.min(Math.max(cx, PAD + BW), innerWidth - PAD - BW),
                    Math.min(Math.max(cy - RY, PAD + BH), BAR - BH)];
  };

  const ribbon = ribbonSpot(cx, cy);
  if (ribbon) placed.push({ l:ribbon[0] - 134, r:ribbon[0] + 134, t:ribbon[1] - 48, b:ribbon[1] + 48 });

  const pu = parentUnionOf(id);
  const isRoot = !!(state.people[id] && state.people[id].root);
  const canParent = !isRoot && (!pu || pu.partners.length < 2);
  const mates = partnersOf(id).map(m => layout.persons[m]).filter(Boolean);
  // stand the sibling bud on whichever side isn't already crowded by a spouse
  const leftBusy = mates.some(q => q.x < at.x), rightBusy = mates.some(q => q.x > at.x);
  const sibFirst = leftBusy && !rightBusy ? [0, -40, 40, 180] : [180, -140, 140, 0];
  const parFirst = leftBusy && !rightBusy ? [180, -140, 140, 0] : [0, -40, 40, 180];

  const out = [
    { kind:'child',   label:'Child',   icon:'↑', at:place([-90, -60, -120, -35, -145]) },
    { kind:'sibling', label:'Sibling', icon:'↔', at:place(sibFirst) },
    { kind:'partner', label:mates.length ? 'Another partner' : 'Partner', icon:'⚭', at:place(parFirst) }
  ];
  if (canParent) out.push({ kind:'parent', icon:'↓',
    label:pu && pu.partners.length ? 'Other parent' : 'Parent', at:place([90, 60, 120, 35, 145]) });

  // Panning re-runs this on every frame. Rebuilding the markup each time would
  // restart the pop-in animation and make the buds flicker, so once the same
  // set is on screen we only move them.
  const sig = id + '|' + out.map(o => o.kind + o.label).join(',') + '|' + (meId || '');
  if (sig === budSig && layer.children.length >= out.length){
    out.forEach((o, i) => {
      layer.children[i].style.left = o.at[0].toFixed(1) + 'px';
      layer.children[i].style.top  = o.at[1].toFixed(1) + 'px';
    });
    const el = layer.querySelector('.term');
    if (el && ribbon){
      el.style.left = ribbon[0].toFixed(1) + 'px';
      el.style.top  = ribbon[1].toFixed(1) + 'px';
    }
    return;
  }
  budSig = sig;
  layer.innerHTML = out.map(o =>
    `<div class="bud" data-bud="${o.kind}" data-anchor="${id}" tabindex="0" role="button"` +
    ` style="left:${o.at[0].toFixed(1)}px; top:${o.at[1].toFixed(1)}px">` +
    `<i>${o.icon}</i>${o.label}</div>`).join('') + relationRibbon(ribbon);
}

/* Where the ribbon sits, or null when there is nothing to say — just below
   the person, pulled inside the edges of the screen. */
function ribbonSpot(cx, cy){
  if (!meId || !sel || sel === meId || !state.people[meId] || !state.people[sel]) return null;
  return [
    Math.min(Math.max(cx, 132), innerWidth - 132),
    Math.min(cy + (POD_H / 2) * pos.k + 52, innerHeight - 96)
  ];
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));

function applyTransform(){
  gtree.setAttribute('transform', `translate(${pos.x},${pos.y}) scale(${pos.k})`);
  podsEl.style.transform = `translate(${pos.x}px, ${pos.y}px) scale(${pos.k})`;
  $('ground').style.top = pos.y + 'px';
  $('ground').style.height = Math.max(0, innerHeight - pos.y) + 'px';
  $('groundline').style.top = pos.y + 'px';
  placeBackdrop();
  placeBuds();
  if (pending && $('form')) placeForm($('form'));
}

/* ── the baobab behind everything ───────────────────────────────────────
   A baobab is famously mostly roots — it looks like a tree planted upside
   down, and it is the reason the layout puts ancestors below the horizon and
   descendants above it.
   
   So the backdrop is not a static picture. It is planted on the horizon, and
   its root system deepens as you travel down into the ancestors: each level of
   root fades in only once the view has descended far enough to be among that
   generation. Going further back through the family is going further down into
   the soil, and the tree behind you grows the roots to match.
   
   Drawn once at startup, then only transformed — panning must not rebuild it. */

/* ── the baobab behind everything ───────────────────────────────────────
   The app is named for a tree it should show. This draws one, faintly, behind
   the family.

   Built from photographic reference rather than traced from it — the geometry
   below is generated, not a copied outline. Three things separate a tree that
   reads as a photograph from one that reads as a diagram, and all three are
   deliberate here:

     VOLUME.  A flat fill has no form. The trunk carries a gradient across it,
              so one flank catches light and the other falls into shadow, and
              vertical striations follow the taper the way bark does.

     TAPER.   Real limbs are thick where they leave the trunk and come to a
              point. Strokes of constant width with round caps are the single
              biggest tell of a drawing, so every limb here is a filled shape
              built from two offset curves that converge at the tip.

     IRREGULARITY. Nothing in a tree is evenly spaced or symmetrical. The
              trunk profile carries fluting and fine noise; limbs wander as
              they travel rather than running straight to their endpoint.

   None of it uses SVG filters. feTurbulence would give better bark, but the
   backdrop is transformed on every pan frame and filtered content re-rasterises
   when it moves — which is exactly the cost you cannot pay on a phone. */

// A polyline smoothed into cubic beziers (Catmull-Rom). Everything below is
// generated as points and passed through here, so nothing has hand-written
// curve handles and nothing comes out mechanically regular.
function bgSmooth(pts, close){
  if (pts.length < 2) return '';
  let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for (let i = 0; i < pts.length - 1; i++){
    const p0 = pts[i - 1] || pts[i], p1 = pts[i];
    const p2 = pts[i + 1], p3 = pts[i + 2] || p2;
    d += `C${(p1[0] + (p2[0] - p0[0]) / 6).toFixed(1)} ${(p1[1] + (p2[1] - p0[1]) / 6).toFixed(1)}` +
         ` ${(p2[0] - (p3[0] - p1[0]) / 6).toFixed(1)} ${(p2[1] - (p3[1] - p1[1]) / 6).toFixed(1)}` +
         ` ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return close ? d + 'Z' : d;
}

// A limb as a closed shape rather than a stroke: walk the centreline offsetting
// left and right by a width that shrinks to nothing, then come back down the
// other side. This is what gives a branch a shoulder and a point.
function bgTaper(pts, w0, w1){
  const L = [], R = [];
  for (let i = 0; i < pts.length; i++){
    const t = i / (pts.length - 1);
    // eased so the limb keeps its bulk near the trunk and thins late, which is
    // how a branch actually carries its load
    const w = (w0 + (w1 - w0) * Math.pow(t, 0.7)) / 2;
    const a = pts[Math.max(0, i - 1)], b = pts[Math.min(pts.length - 1, i + 1)];
    const dx = b[0] - a[0], dy = b[1] - a[1];
    const len = Math.hypot(dx, dy) || 1;
    const nx = -dy / len * w, ny = dx / len * w;
    L.push([pts[i][0] + nx, pts[i][1] + ny]);
    R.push([pts[i][0] - nx, pts[i][1] - ny]);
  }
  return bgSmooth(L) + bgSmooth(R.reverse()).replace(/^M/, 'L') + 'Z';
}

// A limb wanders as it travels. Straight lines between fork points are the
// other half of why generated trees look drawn.
function bgRun(rnd, x, y, ang, len, segs, drift){
  const pts = [[x, y]];
  let a = ang;
  for (let i = 0; i < segs; i++){
    a += (rnd() * 2 - 1) * drift;
    const r = a * Math.PI / 180, step = len / segs;
    const p = pts[pts.length - 1];
    pts.push([p[0] + Math.cos(r) * step, p[1] + Math.sin(r) * step]);
  }
  return { pts, ang: a };
}

function bgGrow(out, rnd, x, y, ang, len, w, depth, spec){
  if (depth > spec.maxDepth || w < 0.9 || len < 7) return;
  const run = bgRun(rnd, x, y, ang, len, 4, spec.drift);
  const tip = run.pts[run.pts.length - 1];
  const wEnd = w * spec.taper;
  out.push({ depth, d: bgTaper(run.pts, w, wEnd) });

  // A canopy multiplies — every limb forks. A root system does the opposite:
  // it commits to a few taproots that carry on down, throwing off the
  // occasional lateral. Branching roots like a canopy gives a curtain of
  // parallel strands that reads as hair, not as a tree.
  const kids = depth < spec.forkUntil ? (depth < 2 ? 3 : 2) : (rnd() < 0.3 ? 2 : 1);
  for (let i = 0; i < kids; i++){
    let a = run.ang + (kids > 1 ? (i - (kids - 1) / 2) * spec.spread : 0)
                    + (rnd() * 2 - 1) * spec.spread * (kids > 1 ? 0.4 : 0.7);
    if (spec.pull) a += (90 - a) * spec.pull;
    bgGrow(out, rnd, tip[0], tip[1], a,
           len * spec.decay * (0.9 + rnd() * 0.2), wEnd * (0.94 + rnd() * 0.1),
           depth + 1, { ...spec, spread: spec.spread * 0.9 });
  }
}

/* The trunk. A baobab's is the whole point of the tree: enormous, squat, and
   fluted like something poured rather than grown, flaring into buttresses
   where it meets the ground. Generated as a profile so the fluting and the
   noise are in the silhouette itself — stripes drawn over a translucent shape
   read as a barcode, which is what the first attempt at this looked like. */
function bgTrunkProfile(rnd, side, H, baseW, topW){
  const pts = [];
  const STEPS = 30;
  for (let i = 0; i <= STEPS; i++){
    const t = i / STEPS;                      // 0 at the ground, 1 at the shoulder
    // Flares hard at the base, then eases — the buttress is most of the width.
    const taper = topW + (baseW - topW) * Math.pow(1 - t, 1.55);
    const flute = Math.sin(t * Math.PI * 2.6 + side * 1.1) * 15 * (1 - t * 0.5)
                + Math.sin(t * Math.PI * 5.7 + side * 2.3) * 6 * (1 - t * 0.7);
    const noise = (rnd() * 2 - 1) * 3.4;
    pts.push([side * Math.max(14, taper + flute + noise), -H * t]);
  }
  return pts;
}

let bgRootGroups = [], bgDeepest = 1;
// The tree's extent in the backdrop's own units. Zero while the drawn tree is
// showing, which is what selects the scaling rule.
let bgPhotoAbove = 0, bgPhotoWidth = 0;

/* ── a photograph, if one has been provided ─────────────────────────────
   Drop a baobab photograph into public/ as one of the names below and it
   replaces the drawn tree. Nothing else changes: no build step, no bundler,
   no package — the server already serves that directory.

   What makes a photograph work here:
     · shot from roughly ground level, horizon across the frame
     · the tree near the middle, with room around it
     · a clean, uncluttered sky
     · landscape, and the larger the better — it is scaled to viewport height
   The dry-season photographs, with the crown bare, read best: at this opacity
   a dense green canopy turns into an undifferentiated smudge.

   BG_PHOTO.horizon is where the ground line sits in YOUR image, measured from
   the top as a fraction. It is the one number that needs adjusting per photo —
   if the tree floats above the ground line or sinks below it, this is why.

   Only use an image you hold the rights to. */
const BG_PHOTO = {
  srcs: ['baobab.webp', 'baobab.jpg', 'baobab.jpeg', 'baobab.png'],
  // The shipped asset is cropped to the tree, so the foot of the trunk is the
  // bottom edge. A raw photograph dropped in instead will be measured, or fall
  // back to this.
  horizon: 0.994,     // fraction of the image height at which the ground sits
  // How much of the viewport's WIDTH the tree spans.
  //
  // Sizing by height keeps the tree small, because only the sky above the
  // horizon is available and that is a little over half the screen. A baobab's
  // presence is in its spread, so width is the dimension worth fixing, and the
  // crown is allowed to run past the top of the frame the way it does in every
  // photograph of one. `crown` caps how much of it may be lost.
  width: 0.95,
  crown: 0.62,        // at most this fraction of the tree may sit off-screen
  // Stretched horizontally. A baobab is squat — the thing everyone recognises
  // is a trunk far too fat for the tree standing on it — and photographs taken
  // from a distance flatten exactly that. Widening the image thickens the
  // trunk and broadens the crown together, which is the proportion the tree
  // has in life rather than the one a lens gives it.
  fatten: 1.72,
  // How hard the sky is cut away. Raise `cut` if the sky lingers as a haze;
  // lower it if fine branches are being eaten. `lift` sets how dark a pixel
  // has to be before it counts as tree at all.
  cut: 1.9,
  lift: 1.5
};

/* A baobab is called the upside-down tree because its crown looks like a root
   system torn out of the ground. So below the horizon the same photograph is
   mirrored — darker, softer, and revealed as the view descends. The roots the
   family travels down into are the tree's own branches, reflected. */
function bgPhotoMarkup(src, w, h, horizon, needsInvert){
  // Sized in the same units the drawn tree uses, from the image's own aspect
  // ratio. placeBackdrop then scales by bgPhotoAbove so the part above the
  // horizon comes out at BG_PHOTO.height of the viewport.
  const H = 1000;
  const W = Math.round(H * (w / h));
  const top = Math.round(-H * horizon);            // horizon lands on y = 0
  const x = Math.round(-W / 2);
  const above = -top;                              // height of the sky portion
  bgPhotoAbove = above;
  bgPhotoWidth = W;

  // The image is a MASK, never pasted in. Its brightness becomes the alpha and
  // what shows through is a flat fill in the app's own bark colour. That keeps
  // the photograph's detail — which is all of what makes it look photographed —
  // while the colour comes from the palette, so one file serves both the day
  // and the night theme instead of a brown tree fighting a midnight sky.
  //
  // A photograph arrives the wrong way round for this (dark tree, bright sky)
  // and is inverted first. A prepared mask is already white-on-black and is
  // passed through untouched, which also skips the filter entirely.
  const sil = needsInvert
    ? `<filter id="bgSil" color-interpolation-filters="sRGB">` +
        `<feColorMatrix type="saturate" values="0"/>` +
        `<feComponentTransfer>` +
          `<feFuncR type="linear" slope="${-BG_PHOTO.cut}" intercept="${BG_PHOTO.lift}"/>` +
          `<feFuncG type="linear" slope="${-BG_PHOTO.cut}" intercept="${BG_PHOTO.lift}"/>` +
          `<feFuncB type="linear" slope="${-BG_PHOTO.cut}" intercept="${BG_PHOTO.lift}"/>` +
        `</feComponentTransfer>` +
      `</filter>`
    : '';

  // Masked to the sky portion only, so the ground in the photograph is never
  // drawn and the app's horizon is the only one in the picture.
  const mask =
    `<mask id="bgSilMask" maskUnits="userSpaceOnUse" ` +
      `x="${x}" y="${top}" width="${W}" height="${above}">` +
      `<image href="${src}" x="${x}" y="${top}" width="${W}" height="${H}" ` +
        `preserveAspectRatio="xMidYMid meet"${needsInvert ? ' filter="url(#bgSil)"' : ''}/>` +
    `</mask>`;

  // The mirrored half has to dissolve into the soil. Left alone the masked
  // panel simply stops, and a straight horizontal edge across the ground is
  // the one thing guaranteed to announce that this is a rectangle.
  // In the mirrored group's own coordinates the horizon is at y=0 and the
  // deep end is at y=top, so the gradient runs opaque at the bottom of the
  // box up to nothing at the far end.
  const fade =
    `<linearGradient id="bgFadeGrad" x1="0" y1="0" x2="0" y2="1">` +
      `<stop offset="0" stop-color="#000"/>` +
      `<stop offset="0.42" stop-color="#666"/>` +
      `<stop offset="1" stop-color="#fff"/>` +
    `</linearGradient>` +
    `<mask id="bgFade" maskUnits="userSpaceOnUse" ` +
      `x="${x}" y="${top}" width="${W}" height="${above}">` +
      `<rect x="${x}" y="${top}" width="${W}" height="${above}" fill="url(#bgFadeGrad)"/>` +
    `</mask>`;

  const panel = (cls, fill) =>
    `<rect class="${cls}" x="${x}" y="${top}" width="${W}" height="${above}" ` +
    `fill="${fill}" mask="url(#bgSilMask)"/>`;

  // Mirrored about the horizon: the crown becomes the root system. But a
