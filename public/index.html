  // single reflection is only as deep as the crown is tall, and then the
  // ground is simply empty — travelling further back through the ancestors
  // would be rewarded with nothing, which is the whole point failing at the
  // moment it should pay off.
  //
  // So the reflection is layered. Each copy reaches further down and draws in
  // narrower, the way a root system tapers as it goes; each is tagged with a
  // depth, and the existing descent fade brings them in one after another. The
  // roots the family travels down into keep going for as long as there is
  // family to travel through.
  const layers = [
    { y: 1.00, x: 1.00 },
    { y: 1.95, x: 0.84 },
    { y: 3.40, x: 0.66 }
  ].map((L, i) =>
    `<g class="bg-roots" data-depth="${i}" transform="scale(${L.x},${-L.y})">` +
      `<g mask="url(#bgFade)">${panel('bg-photo bg-photo-roots', 'var(--root)')}</g>` +
    `</g>`).join('');

  return `<defs>${sil}${mask}${fade}</defs>` +
    panel('bg-photo', 'var(--bark)') + layers;
}

// Resolve the first name that actually exists. A missing photograph is not an
// error — it is the ordinary case, and the drawn tree stands in for it.
function bgFindPhoto(done){
  let i = 0;
  const tryNext = () => {
    if (i >= BG_PHOTO.srcs.length) return done(null);
    const src = BG_PHOTO.srcs[i++];
    const img = new Image();
    img.onload = () => done({ src, w: img.naturalWidth, h: img.naturalHeight,
                              ...bgInspect(img) });
    img.onerror = tryNext;
    img.src = src;
  };
  tryNext();
}

/* Where does the ground sit in this particular photograph?
 
   Asking whoever adds the image to measure that and type in a fraction is a
   bad trade: it is fiddly, it is easy to get slightly wrong, and getting it
   slightly wrong makes the tree float above the horizon or sink into it.
 
   A tree cut out on a white background — much the easiest kind of photograph
   to use here — answers the question by itself: the foot of the trunk is
   simply the lowest row that is not background. So the image is sampled once,
   and if it turns out to have a clean uniform border, the bottom of the
   subject becomes the horizon.
 
   A full landscape photograph has content running to every edge and cannot be
   measured this way, so it falls back to the configured fraction. The console
   says which happened, because a backdrop sitting at the wrong height is
   otherwise a puzzling thing to debug. */
function bgInspect(img){
  try {
    const N = 220;                                   // sampled small; this is a
    const c = document.createElement('canvas');      // measurement, not a render
    const w = c.width = N;
    const h = c.height = Math.max(1, Math.round(N * img.naturalHeight / img.naturalWidth));
    const ctx = c.getContext('2d', { willReadFrequently: true });
    if (!ctx) return null;
    ctx.drawImage(img, 0, 0, w, h);
    const px = ctx.getImageData(0, 0, w, h).data;
    const lum = (x, y) => {
      const i = (y * w + x) * 4;
      return (px[i] * 0.2126 + px[i + 1] * 0.7152 + px[i + 2] * 0.0722) / 255;
    };

    const corners = [lum(1, 1), lum(w - 2, 1), lum(1, h - 2), lum(w - 2, h - 2)];
    const bg = corners.reduce((a, b) => a + b, 0) / 4;
    const spread = Math.max(...corners) - Math.min(...corners);

    // Two kinds of file end up here, and they need opposite treatment.
    //
    // A prepared MASK is the tree in white on black — it is already the alpha
    // channel and is used exactly as it is. A PHOTOGRAPH is a dark tree on a
    // bright sky, and has to be inverted before its darkness can serve as the
    // alpha. Getting this backwards produces a page-filling rectangle with a
    // tree-shaped hole in it, so it is worth deciding from the pixels rather
    // than from the filename.
    const needsInvert = bg > 0.5;
    if (!needsInvert) return { needsInvert };        // a mask: horizon is configured

    // A photograph with a clean uniform border is a cut-out, and the foot of
    // the subject tells us where the ground is. One with content at every edge
    // is a landscape and cannot be measured this way.
    if (spread > 0.16) return { needsInvert };
    const cut = bg - 0.2;
    for (let y = h - 1; y >= 0; y--){
      let dark = 0;
      for (let x = 0; x < w; x++) if (lum(x, y) < cut) dark++;
      if (dark > w * 0.006) return { needsInvert, horizon: Math.min(0.995, (y + 1) / h) };
    }
    return { needsInvert };
  } catch (e) {
    return { needsInvert: true };                    // never block on a measurement
  }
}

function buildBackdrop(){
  const g = $('bgTree');
  if (!g) return;
  // Draw the generated tree immediately so there is never a blank backdrop,
  // then swap in a photograph if one turns out to be there. Waiting on a
  // network round trip before painting anything would show a bare page first.
  buildDrawnBackdrop();
  if (typeof Image === 'function'){
    bgFindPhoto(found => {
      if (!found) return;
      const horizon = found.horizon || BG_PHOTO.horizon;
      console.log(`Backdrop: ${found.src} — ` +
        `${found.needsInvert ? 'photograph, inverting to a mask' : 'prepared mask, used as is'}, ` +
        `horizon ${found.horizon ? `measured at ${(horizon * 100).toFixed(1)}%`
                                 : `set to ${(horizon * 100).toFixed(1)}%`}`);
      g.innerHTML = bgPhotoMarkup(found.src, found.w, found.h, horizon, found.needsInvert);
      g.classList.add('has-photo');
      bgRootGroups = Array.from(g.querySelectorAll('.bg-roots'))
        .map(el => ({ el, depth: Number(el.dataset.depth) }));
      bgDeepest = 0;
      placeBackdrop();
    });
  }
}

function buildDrawnBackdrop(){
  const g = $('bgTree');
  if (!g) return;
  // Seeded, so the tree behind the family is the same tree on every visit and
  // on every device. Scenery that reshuffles between sessions is a distraction.
  let seed = 20260830 >>> 0;
  const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;

  const H = 318, BASE_W = 330, TOP_W = 132;
  const left = bgTrunkProfile(rnd, -1, H, BASE_W, TOP_W);
  const right = bgTrunkProfile(rnd, 1, H, BASE_W, TOP_W);
  // Crossing the top with a straight line gave the trunk a flat lid and made
  // it read as a boulder. The shoulder domes instead, unevenly — it is where
  // the limbs tear away, and it is never level.
  const shoulder = [];
  for (let i = 1; i < 5; i++){
    const t = i / 5;
    shoulder.push([(-TOP_W + 2 * TOP_W * t) * 0.98,
                   -H - Math.sin(t * Math.PI) * 26 - (rnd() * 2 - 1) * 7]);
  }
  const trunk = bgSmooth(left.concat(shoulder, right.slice().reverse()), true);

  // Striations following the taper, so the trunk has grain running up it.
  const grain = [];
  for (let i = 0; i < 15; i++){
    const at = -0.88 + (i / 14) * 1.76 + (rnd() * 2 - 1) * 0.03;
    const top = 0.62 + rnd() * 0.3;
    const pts = [];
    for (let j = 0; j <= 8; j++){
      const t = (j / 8) * top;
      const taper = TOP_W + (BASE_W - TOP_W) * Math.pow(1 - t, 1.55);
      pts.push([at * taper * (1 - t * 0.06) + (rnd() * 2 - 1) * 2.2, -H * t]);
    }
    grain.push({ d: bgSmooth(pts), w: (0.5 + rnd() * 1.5).toFixed(2),
                 o: (0.25 + rnd() * 0.55).toFixed(2) });
  }

  const canopy = [], roots = [];
  // Baobab limbs leave the trunk almost horizontally before turning up, and
  // they are enormously thick where they leave it.
  [[-118, -152, 46], [-62, -126, 52], [-4, -98, 54], [58, -60, 50], [116, -28, 44]]
    .forEach(([x, a, w]) => {
      // Three levels, not four, and a blunt taper. At this opacity a fourth
      // generation of twigs stops reading as a tree and starts reading as
      // scratches — detail you cannot see is only noise.
      bgGrow(canopy, rnd, x, -H + 14 + Math.abs(x) * 0.05, a, 168 + rnd() * 44, w, 0,
             { maxDepth: 3, forkUntil: 9, decay: 0.66, taper: 0.68,
               spread: 25, curl: 1, drift: 6 });
    });
  // Roots go far deeper than the canopy is tall and keep most of their length
  // each generation, so travelling down through the ancestors keeps finding
  // more tree rather than running out of it.
  [[-198, 121], [-112, 105], [-38, 95], [38, 85], [112, 71], [198, 57]]
    .forEach(([x, a]) => {
      bgGrow(roots, rnd, x, -6, a, 196 + rnd() * 44, 34, 0,
             { maxDepth: 7, forkUntil: 2, decay: 0.88, taper: 0.84,
               spread: 25, curl: 0.85, pull: 0.07, drift: 6 });
    });

  // Clipped to the trunk, so the grain can never wander off it into the soil.
  const out = [`<defs><clipPath id="bgTrunkClip"><path d="${trunk}"/></clipPath></defs>`];

  for (const l of canopy) out.push(`<path class="bg-limb" d="${l.d}"/>`);
  out.push(`<path class="bg-trunk" d="${trunk}"/>`);
  out.push('<g clip-path="url(#bgTrunkClip)">');
  for (const s of grain){
    out.push(`<path class="bg-grain" stroke-width="${s.w}" opacity="${s.o}" d="${s.d}"/>`);
  }
  out.push('</g>');

  // Foliage last, so it sits in FRONT of the branches and softens them, the
  // way a canopy in leaf does. Not drawn as leaves — at this distance
  // individual leaves are noise. It is the soft mass a crown makes when it is
  // far enough away to have no edges.
  // The crown: the broad, flat-topped dome a baobab makes in leaf, and the
  // half of the silhouette that carries the whole shape. Laid out along an arc
  // rather than scattered — a random spread came out lopsided, and a crown
  // that leans is the first thing the eye finds wrong.
  const crownY = -H - 54;
  for (const ring of [{ n: 15, rx: 372, ry: 150, s: 1 }, { n: 10, rx: 226, ry: 96, s: 0.86 }]){
    for (let i = 0; i < ring.n; i++){
      const t = i / (ring.n - 1);
      const a = Math.PI * (1 - t);                    // left rim round to right
      const cx = Math.cos(a) * ring.rx * (0.94 + rnd() * 0.12);
      const cy = crownY - Math.sin(a) * ring.ry * (0.82 + rnd() * 0.36);
      out.push(`<ellipse class="bg-haze" cx="${cx.toFixed(0)}" cy="${cy.toFixed(0)}" ` +
               `rx="${(112 * ring.s + rnd() * 54).toFixed(0)}" ` +
               `ry="${(56 * ring.s + rnd() * 26).toFixed(0)}"/>`);
    }
  }

  // Roots are grouped by depth, because each group fades in at a different
  // point in the descent.
  bgDeepest = roots.reduce((n, r) => Math.max(n, r.depth), 0);
  for (let d = 0; d <= bgDeepest; d++){
    const level = roots.filter(r => r.depth === d);
    if (!level.length) continue;
    out.push(`<g class="bg-roots" data-depth="${d}">` +
      level.map(r => `<path class="bg-root" d="${r.d}"/>`).join('') + `</g>`);
  }

  g.innerHTML = out.join('');
  // Cached: read on every pan frame, and querying the DOM each time would make
  // dragging measurably worse on a phone.
  bgRootGroups = Array.from(g.querySelectorAll('.bg-roots'))
    .map(el => ({ el, depth: Number(el.dataset.depth) }));
  placeBackdrop();
}

function placeBackdrop(){
  const g = $('bgTree');
  if (!g || typeof g.setAttribute !== 'function') return;

  // Planted on the horizon — the ground line sits at pos.y, so the trunk foot
  // tracks it exactly. Sideways it drifts at a fraction of the pan, and it
  // grows far more slowly than the family does on zoom, which is what puts it
  // at a distance rather than in the way.
  // A photograph is framed to its own proportions; the drawn tree has a fixed
  // size it was designed at. Either way it grows far more slowly than the
  // family does on zoom, which is what keeps it at a distance.
  let scale;
  if (bgPhotoAbove){
    // Span the target width, then pull back if that would push more of the
    // crown off the top than `crown` allows — on a short, wide window the
    // width target alone would leave nothing but trunk.
    const byWidth = (innerWidth * BG_PHOTO.width) / (bgPhotoWidth * BG_PHOTO.fatten);
    const cap = (innerHeight * 0.6 / (1 - BG_PHOTO.crown)) / bgPhotoAbove;
    scale = Math.min(byWidth, cap);
  } else {
    scale = Math.max(0.3, Math.min(1.5, (innerHeight * 0.86) / 900));
  }
  scale *= (1 + (pos.k - 1) * 0.2);
  const fat = bgPhotoAbove ? BG_PHOTO.fatten : 1;
  g.setAttribute('transform',
    `translate(${(innerWidth / 2 + pos.x * 0.12).toFixed(1)} ${pos.y.toFixed(1)}) ` +
    `scale(${(scale * fat).toFixed(3)} ${scale.toFixed(3)})`);

  // How far the view has travelled below the horizon, which in this layout is
  // how far back through the ancestors you have gone.
  const descent = Math.max(0, Math.min(1,
    (innerHeight * 0.45 - pos.y) / (innerHeight * 1.6)));
  for (const r of bgRootGroups){
    // Each level waits its turn, so the root system visibly lengthens the
    // further down you travel rather than all arriving at once.
    const shown = Math.max(0, Math.min(1, (descent - r.depth * 0.085) / 0.3));
    r.el.style.opacity = (0.35 + 0.65 * shown).toFixed(3);
  }
}

/* The review panel: every pair the tree thinks might be one person, with
   the evidence, and two ways out — keep one, or say they really are two. */
function openDuplicates(){
  closeForm();
  const pairs = duplicatePairs();
  const strongCount = pairs.filter(d => d.strong || d.score >= 0.75).length;
  pending = { kind:'dupes', anchorId:sel || state.rootId };

  const el = document.createElement('div');
  el.id = 'form';
  el.className = 'wide';
  el.innerHTML =
    `<p class="cap">Possibly the same person</p>` +
    (pairs.length ? pairs.map((d, i) => {
      const a = state.people[d.a], b = state.people[d.b];
      const line = q => `${q.born ? esc(q.born) + (q.died ? ' – ' + esc(q.died) : '') + ' · ' : ''}` +
        `${esc(positionOf(q.id))}`;
      const strong = d.strong || d.score >= 0.75;
      return `<div class="pair${strong ? '' : ' weak'}" data-i="${i}">` +
        `<p class="keepnote">${strong ? 'Very likely one person' : 'Same name — probably two people'}` +
        `<span>Keep which record?</span></p>` +
        `<div class="two">` +
          `<button type="button" data-keep="${d.a}" data-drop="${d.b}">${esc(a.name)}<small>${line(a)}</small></button>` +
          `<button type="button" data-keep="${d.b}" data-drop="${d.a}">${esc(b.name)}<small>${line(b)}</small></button>` +
        `</div>` +
        `<p>${esc(d.why.join(' · '))}</p>` +
        (d.against.length ? `<p class="against">Against: ${esc(d.against.join(' · '))}</p>` : '') +
        `<button type="button" class="btn ghost wide" data-not="${d.a}|${d.b}">They are two different people</button>` +
      `</div>`;
    }).join('')
      : `<p class="warn">Nothing looks doubled at the moment. A shared name is not ` +
        `enough on its own — children are named after their grandparents all the ` +
        `time. What counts is the shape of the family around them: the same ` +
        `husband or wife, the same children, the same parents.</p>`) +
    `<div class="row"><button class="btn" id="dNo">Done</button></div>`;
  document.body.appendChild(el);
  placeForm(el);

  el.querySelectorAll('[data-keep]').forEach(btn => btn.onclick = () => {
    const keep = btn.dataset.keep, drop = btn.dataset.drop;
    const gone = state.people[drop].name, kept = state.people[keep].name;
    mergePeople(keep, drop);
    closeForm(); render(); save();
    say(`${gone} folded into ${kept}. One record now.`);
    if (duplicatePairs().length) openDuplicates();
  });
  el.querySelectorAll('[data-not]').forEach(btn => btn.onclick = () => {
    const [a, b] = btn.dataset.not.split('|');
    dismissDuplicate(a, b);
    closeForm(); render(); save();
    if (duplicatePairs().length) openDuplicates();
  });
  $('dNo').onclick = closeForm;
  el.addEventListener('keydown', e => { if (e.key === 'Escape'){ e.preventDefault(); closeForm(); } });
}

/* The calculator panel. */
let kinA = null, kinB = null;

function kinName(id){
  const p = state.people[id];
  return p ? p.name : '';
}

function kinPicker(side, chosen){
  const val = chosen ? esc(kinName(chosen)) : '';
  return `<p class="lbl">${side === 'a' ? 'Person' : 'Seen by'}</p>` +
    `<input id="kin${side.toUpperCase()}" class="fld kinpick" data-side="${side}" ` +
      `value="${val}" placeholder="Type a name" autocomplete="off">` +
    `<div class="kinlist" data-for="${side}"></div>`;
}

function kinVerdict(from, to){
  if (!from || !to) return '';
  if (from === to) return `<p class="relline"><b>—</b><span>the same person</span></p>`;
  const r = relationship(from, to);
  if (!r) return '';
  const term = r.term || r.choice;
  return `<p class="relline${term ? '' : ' none'}">` +
    `<b>${esc(term || 'Not named')}</b>` +
    `<span>${esc(kinName(to))} is ${esc(kinName(from))}'s ${term ? esc(term) : 'relative'} ` +
    `— ${esc(r.why)}</span></p>`;
}

function openKinship(){
  closeForm();
  if (!kinA || !state.people[kinA]) kinA = meId || sel || state.rootId;
  if (kinB && !state.people[kinB]) kinB = null;
  pending = { kind: 'dupes', anchorId: kinA || state.rootId };

  const cov = kinshipCoverage();
  const pct = cov.checked ? Math.round(cov.named / cov.checked * 100) : 100;
  const gapRow = (n, label, fix) => n
    ? `<div class="gaprow"><b>${n}</b><span>${esc(label)}<em>${esc(fix)}</em></span></div>` : '';

  const el = document.createElement('div');
  el.id = 'form';
  el.className = 'wide';
  el.innerHTML =
    `<p class="cap">What are they to each other?</p>` +
    `<div class="kinpair">` +
      `<div>${kinPicker('a', kinA)}</div>` +
      `<div>${kinPicker('b', kinB)}</div>` +
    `</div>` +
    (kinA && kinB
      // Both ways round, because the terms are not reciprocal: your mother's
      // brother is Sekuru to you, and you are Muzukuru to him.
      ? kinVerdict(kinA, kinB) + kinVerdict(kinB, kinA)
      : `<p class="warn">Pick two people. Shona terms are not reciprocal, so ` +
        `both directions are shown — your mother's brother is <b>Sekuru</b> to ` +
        `you, and you are <b>Muzukuru</b> to him.</p>`) +

    `<p class="lbl" style="margin-top:14px;">What this tree can name</p>` +
    `<div class="covbar"><i style="width:${pct}%"></i></div>` +
    `<p class="covnote"><b>${cov.named}</b> of ${cov.checked} relationships named ` +
    `(${pct}%)${cov.sampled ? ` — sampled from ${cov.total.toLocaleString()} pairs` : ''}</p>` +

    (cov.named === cov.checked
      ? `<p class="covnote">Every pair in the tree has a name. Adding more people ` +
        `is what will find the next gap.</p>`
      : `<div class="gaps">` +
        gapRow(cov.gaps.seniority.length, 'older or younger is undecided',
               'both birth years are needed to choose Mukoma from Munin\u2019ina') +
        gapRow(cov.gaps.sex.length, 'the term depends on he or she',
               'record which, and the word follows') +
        gapRow(cov.gaps.unlinked.length, 'no traced link between them',
               'add the people in between') +
        gapRow(cov.gaps.described.length, 'described rather than named',
               'the family has no single word for these; the app will not invent one') +
        `</div>`) +

    (cov.asks.length
      ? `<p class="lbl" style="margin-top:12px;">Ask about these next</p>` +
        cov.asks.map(a =>
          `<button type="button" class="askrow" data-ask="${a.id}">` +
            `<u>${esc(kinName(a.id))}<small>${a.need === 'born' ? 'birth year' : 'he or she'} ` +
            `unknown</small></u><em>${a.count} relationship${a.count === 1 ? '' : 's'}</em>` +
          `</button>`).join('')
      : '') +

    `<div class="row" style="margin-top:12px;"><button class="btn" id="kNo">Done</button></div>`;
  document.body.appendChild(el);
  placeForm(el);

  // Name pickers: filter as you type, click to choose.
  el.querySelectorAll('.kinpick').forEach(inp => {
    const side = inp.dataset.side;
    const list = el.querySelector(`.kinlist[data-for="${side}"]`);
    const show = () => {
      const q = inp.value.trim().toLowerCase();
      const hits = people()
        .filter(p => !q || p.name.toLowerCase().includes(q))
        .slice(0, 6);
      list.innerHTML = hits.map(p =>
        `<button type="button" data-pick="${p.id}">${esc(p.name)}` +
        `<small>${esc(positionOf(p.id))}</small></button>`).join('');
      list.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
        if (side === 'a') kinA = b.dataset.pick; else kinB = b.dataset.pick;
        openKinship();
      });
    };
    inp.addEventListener('input', show);
    inp.addEventListener('focus', show);
  });
  el.querySelectorAll('[data-ask]').forEach(b => b.onclick = () => openCard(b.dataset.ask));
  $('kNo').onclick = closeForm;
  el.addEventListener('keydown', e => { if (e.key === 'Escape'){ e.preventDefault(); closeForm(); } });
}

/* The card behind a person: the details that aren't worth room on the pod,
   the switch that marks the end of a line, and what they are to you. */
function openCard(id){
  closeForm();
  const p = state.people[id];
  if (!p) return;
  pending = { kind:'card', anchorId:id };
  const rel = meId && meId !== id ? relationship(meId, id) : null;

  const el = document.createElement('div');
  el.id = 'form';
  el.innerHTML =
    `<p class="cap">${esc(p.name)}</p>` +
    (rel ? `<p class="lbl">To you</p><p class="relline">` +
      `<b>${esc(rel.term || rel.choice || '')}</b>` +
      `<span>${esc(rel.why)}</span></p>` : '') +
    `<input id="cName" class="fld" value="${esc(p.name)}" placeholder="Name" autocomplete="off">` +
    `<div class="seg" id="cSex">` +
      `<button type="button" data-sex="f" aria-pressed="${p.sex === 'f'}">She</button>` +
      `<button type="button" data-sex="m" aria-pressed="${p.sex === 'm'}">He</button>` +
      `<button type="button" data-sex="" aria-pressed="${!p.sex}">—</button></div>` +
    `<p class="lbl">Born · Died</p><div class="row">` +
      `<input id="cBorn" class="fld" value="${esc(p.born || '')}" placeholder="Born" autocomplete="off">` +
      `<input id="cDied" class="fld" value="${esc(p.died || '')}" placeholder="Died" autocomplete="off">` +
    `</div>` +
    `<input id="cTotem" class="fld" value="${esc(p.totem || '')}" placeholder="Totem / mutupo" autocomplete="off">` +
    `<button class="btn ghost wide${p.root ? ' on' : ''}" id="cRoot">` +
      `${p.root ? '● ' : ''}Furthest we can trace</button>` +
    `<button class="btn ghost wide${meId === id ? ' on' : ''}" id="cMe">` +
      `${meId === id ? '● This is you' : 'This is me'}</button>` +
    `<div class="row"><button class="btn" id="cSave">Save</button>` +
    `<button class="btn ghost" id="cNo">Close</button></div>`;
  document.body.appendChild(el);
  placeForm(el);

  el.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(btn =>
    btn.onclick = () => seg.querySelectorAll('button')
      .forEach(o => o.setAttribute('aria-pressed', String(o === btn)))));

  const commit = () => {
    snapshot();
    p.name  = $('cName').value.trim() || p.name;
    p.sex   = document.querySelector('#cSex button[aria-pressed="true"]').dataset.sex;
    p.born  = $('cBorn').value.trim();
    p.died  = $('cDied').value.trim();
    p.totem = $('cTotem').value.trim();
  };
  $('cSave').onclick = () => { commit(); closeForm(); render(); save(); };
  $('cNo').onclick = closeForm;
  $('cRoot').onclick = () => { commit(); toggleRoot(id); closeForm(); render(); save();
    say(`${p.name} ${p.root ? 'is now the root of the line' : 'is no longer marked as the root'}.`); };
  $('cMe').onclick = () => { commit(); setMe(meId === id ? null : id); closeForm(); render(); save(); };
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); commit(); closeForm(); render(); save(); }
    if (e.key === 'Escape'){ e.preventDefault(); closeForm(); }
  });
  $('cName').focus();
}

/* ── grow form ──────────────────────────────────────────────────────── */
const LABEL = { parent:'parent of', sibling:'sibling of', partner:'partner of', child:'child of' };

function openForm(kind, anchorId){
  closeForm();
  pending = { kind, anchorId };
  const anchor = state.people[anchorId];

  // A new brother or sister has to land somewhere in the row, and birth order
  // is the whole point of the row — so ask while the name is being typed.
  const order = kind !== 'sibling' ? '' :
    `<p class="lbl">Born</p><div class="seg" id="fOrder">` +
    `<button type="button" data-pos="older" aria-pressed="false">Before ${esc(anchor.name.split(' ')[0])}</button>` +
    `<button type="button" data-pos="younger" aria-pressed="true">After</button></div>`;

  // Somebody who married more than once needs to say whose child this is.
  const marriages = unionsOf(anchorId);
  const withWho = (kind !== 'child' || marriages.length < 2) ? '' :
    `<p class="lbl">With</p><div class="seg" id="fWith">` +
    marriages.map((u, i) => {
      const other = u.partners.find(x => x !== anchorId);
      const who = other && state.people[other] ? state.people[other].name.split(' ')[0] : 'on their own';
      return `<button type="button" data-union="${u.id}" aria-pressed="${i === 0}">${esc(who)}</button>`;
    }).join('') + `</div>`;

  const el = document.createElement('div');
  el.id = 'form';
  el.innerHTML =
    `<p class="cap">New <b>${LABEL[kind]}</b><br>${esc(anchor.name)}</p>` +
    `<input id="fName" class="fld" placeholder="Name" autocomplete="off">` +
    `<div class="seg" id="fSex">` +
      `<button type="button" data-sex="f" aria-pressed="false">She</button>` +
      `<button type="button" data-sex="m" aria-pressed="false">He</button>` +
      `<button type="button" data-sex="" aria-pressed="true">—</button></div>` +
    order + withWho +
    `<input id="fTotem" class="fld" placeholder="Totem / mutupo (optional)" autocomplete="off">` +
    `<div class="row">` +
      `<input id="fBorn" class="fld" placeholder="Born" autocomplete="off">` +
      `<input id="fDied" class="fld" placeholder="Died" autocomplete="off">` +
    `</div>` +
    `<div class="row"><button class="btn" id="fGo">Grow</button>` +
    `<button class="btn ghost" id="fNo">Cancel</button></div>`;
  document.body.appendChild(el);
  placeForm(el);

  el.querySelectorAll('.seg').forEach(seg => seg.querySelectorAll('button').forEach(b =>
    b.onclick = () => seg.querySelectorAll('button')
      .forEach(o => o.setAttribute('aria-pressed', String(o === b)))));
  $('fGo').onclick = submitForm;
  $('fNo').onclick = closeForm;
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter'){ e.preventDefault(); submitForm(); }
    if (e.key === 'Escape'){ e.preventDefault(); closeForm(); }
  });

  // Watch the name as it is typed and offer anyone already in the tree who
  // might be the same person, so two branches meeting in the middle join up
  // instead of each keeping their own copy of a grandfather.
  const box = document.createElement('div');
  box.className = 'dupes';
  $('fName').insertAdjacentElement('afterend', box);
  const nameEl = $('fName');
  const suggest = () => {
    // the form may have closed while this was waiting its turn
    if (!nameEl.isConnected) return;
    const matches = matchesForName(nameEl.value, anchorId);
    box.innerHTML = matches.map(({ id, m }) => {
      const q = state.people[id];
      const blocked = canLink(kind, anchorId, id);
      const life = q.born ? `b. ${esc(q.born)} · ` : '';
      const rel = meId ? (relationship(meId, id) || {}) : {};
      const tag = rel.term ? ` · your ${esc(rel.term)}` : '';
      return `<button type="button" class="dupe" data-link="${id}"${blocked ? ' disabled' : ''}` +
        ` title="${esc(blocked || 'Link this person in rather than adding a second record')}">` +
        `<u>${esc(q.name)}<small>${life}${esc(positionOf(id))}${tag}</small></u>` +
        `<em>${blocked ? 'can’t link' : 'use this one'}</em></button>`;
    }).join('');
    box.querySelectorAll('.dupe:not([disabled])').forEach(btn => btn.onclick = () => {
      const otherId = btn.dataset.link;
      const before = screenOf(anchorId);
      linkExisting(kind, anchorId, otherId);
      closeForm();
      sel = otherId;
      render();
      keepSteady(anchorId, before);
      bringIntoView(otherId);
      save();
      say(`${state.people[otherId].name} linked in — one record, not two.`);
    });
  };
  nameEl.addEventListener('input', () => {
    clearTimeout(suggestTimer);
    suggestTimer = setTimeout(suggest, 160);
  });

  $('fName').focus();
}

function placeForm(el){
  const at = layout.persons[pending.anchorId];
  if (!at) return;
  const off = { parent:[0,190], sibling:[-230,0], partner:[230,0], child:[0,-190],
                card:[0,0], dupes:[0,0] }[pending.kind] || [0, 0];
  // offsetWidth/Height, not getBoundingClientRect — the form is mid-animation
  // when it is first placed, and the rect would report its scaled-down size.
  const halfW = (el.offsetWidth || 252) / 2, halfH = (el.offsetHeight || 300) / 2;
  const padX = halfW + 12, padTop = halfH + 12, padBot = halfH + 88;   // clear the toolbar
  let x = at.x * pos.k + pos.x + off[0];
  let y = at.y * pos.k + pos.y + off[1];
  x = Math.max(padX, Math.min(Math.max(padX, innerWidth - padX), x));
  y = Math.max(padTop, Math.min(Math.max(padTop, innerHeight - padBot), y));
  el.style.left = x + 'px';
  el.style.top = y + 'px';
}

function submitForm(){
  const name = $('fName').value.trim();
  if (!name){ $('fName').focus(); return; }
  // Only warn when the name is an exact match and nothing else is known —
  // a shared name is normal, so this must not cry wolf.
  const near = matchesForName(name, pending.anchorId).filter(x => x.m.score >= 0.34);
  if (near.length && !submitForm.confirmed){
    // A strong match on the way out gets one plain question rather than a
    // silent duplicate. Pressing Grow again goes ahead regardless.
    const q = state.people[near[0].id];
    const box = document.querySelector('#form .dupes');
    if (box && !document.querySelector('#form .warn')){
      box.insertAdjacentHTML('beforebegin',
        `<p class="warn"><b>${esc(q.name)}</b> is already in the tree — ${esc(positionOf(near[0].id))}. ` +
        `If that is the same person, use them above. If not, press Grow again: ` +
        `two people in one family can share a name.</p>`);
      submitForm.confirmed = true;
      return;
    }
  }
  submitForm.confirmed = false;
  const pick = (id, attr) => {
    const el = document.querySelector('#' + id + ' button[aria-pressed="true"]');
    return el ? el.dataset[attr] : undefined;
  };
  const sex = pick('fSex', 'sex') || '';
  const totem = $('fTotem').value;
  const { kind, anchorId } = pending;
  const before = screenOf(anchorId);
  const id = grow(kind, anchorId, name, sex, totem, {
    position:pick('fOrder', 'pos'), unionId:pick('fWith', 'union'),
    born:$('fBorn').value, died:$('fDied').value
  });
  closeForm();
  sel = id;
  render();
  keepSteady(anchorId, before);           // the person you grew from stays put
  bringIntoView(id);                      // …and the new one is never off-screen
  revealBuds();                           // …nor are the choices around them
  save();
  say(`${name} added as ${LABEL[kind]} ${state.people[anchorId].name}.`);
}

/* Growing re-flows the whole tree. Pin the person you grew from to the same
   spot on screen so the tree appears to grow around them rather than jump. */
function screenOf(id){
  const at = layout.persons[id];
  return at ? { x:at.x * pos.k + pos.x, y:at.y * pos.k + pos.y } : null;
}
/* Selecting somebody near the edge shouldn't hide their own buds — nudge the
   view just enough to give them room, which matters most on a phone. */
function bringIntoView(id){
  const s = screenOf(id);
  if (!s) return;
  const mx = Math.min(200, innerWidth * 0.28), top = 120, bot = 150;
  let dx = 0, dy = 0;
  if (s.x < mx) dx = mx - s.x;
  else if (s.x > innerWidth - mx) dx = innerWidth - mx - s.x;
  if (s.y < top) dy = top - s.y;
  else if (s.y > innerHeight - bot) dy = innerHeight - bot - s.y;
  if (dx || dy){ pos.x += dx; pos.y += dy; applyTransform(); }
}

/* Measure what actually got drawn and shift the view so the selected person
   and every bud around them are on screen. A choice you can't see is a choice
   you don't have. */
function revealBuds(){
  const pod = podsEl.querySelector('.pod.sel');
  if (!pod) return;
  const parts = [pod, ...$('buds').querySelectorAll('.bud')].map(el => el.getBoundingClientRect());
  const box = parts.reduce((a, r) => ({
    left:Math.min(a.left, r.left), right:Math.max(a.right, r.right),
    top:Math.min(a.top, r.top), bottom:Math.max(a.bottom, r.bottom)
  }), { left:Infinity, right:-Infinity, top:Infinity, bottom:-Infinity });

  const pad = 14, barTop = innerHeight - 74;    // keep clear of the toolbar
  let dx = 0, dy = 0;
  if (box.right - box.left < innerWidth - pad * 2){
    if (box.left < pad) dx = pad - box.left;
    else if (box.right > innerWidth - pad) dx = innerWidth - pad - box.right;
  }
  if (box.bottom - box.top < barTop - pad){
    if (box.top < pad) dy = pad - box.top;
    else if (box.bottom > barTop) dy = barTop - box.bottom;
  }
  if (dx || dy){ pos.x += dx; pos.y += dy; applyTransform(); }
}

function keepSteady(id, before){
  const after = screenOf(id);
  if (!before || !after) return;
  pos.x += before.x - after.x;
  pos.y += before.y - after.y;
  applyTransform();
}

let suggestTimer = null;

function closeForm(){
  clearTimeout(suggestTimer);
  const f = $('form');
  if (f) f.remove();
  pending = null;
  submitForm.confirmed = false;
}
const say = m => { $('live').textContent = m; };

/* ── the kinship calculator ─────────────────────────────────────────────
   Two jobs. It names what any two people are to each other, in both
   directions — which matters here, because Shona terms are asymmetric: the
   man your mother's brother is Sekuru to you, and you are Muzukuru to him.
 
   And it reports what the tree CANNOT yet name, and precisely which missing
   fact would fix each case. That is the part that improves as the family is
   entered: the rules never change, but the tree's ability to apply them grows
   with every birth year and every link somebody adds. So the panel does not
   just say "94% named" — it says which person to ask about next, and how many
   relationships that one answer would settle.
 
   A note on what this deliberately is NOT. The engine is rule-based, not
   learned, and that is the correct choice rather than a shortcut. Shona
   kinship is a specified cultural system, not a statistical regularity to be
   inferred: a model trained on a partly-built family tree would happily invent
   plausible-looking terms for relationships the language does not name that
   way. The brief for this app was explicit that where a term is not known the
   app should describe the relationship and ask, never guess — and a learned
   model is precisely a machine for guessing. What grows here is coverage and
   evidence, not confidence. */

// Every pair the tree cannot yet name, sorted by what is missing.
function kinshipCoverage(budget){
  budget = budget || 4000;
  ancestryCache.clear();
  const ids = people().map(p => p.id);
  const n = ids.length;
  const total = n * (n - 1) / 2;

  let pairs = [];
  let sampled = false;
  if (total <= budget){
    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) pairs.push([ids[i], ids[j]]);
  } else {
    // A large tree is measured from a sample rather than made to grind through
    // millions of pairs. Seeded, so the number does not jitter between opens.
    sampled = true;
    let seed = 987654321 >>> 0;
    const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
    const seen = new Set();
    let guard = 0;
    while (pairs.length < budget && guard++ < budget * 12){
      const i = Math.floor(rnd() * n), j = Math.floor(rnd() * n);
      if (i === j) continue;
      const lo = Math.min(i, j), hi = Math.max(i, j), k = lo + '|' + hi;
      if (seen.has(k)) continue;
      seen.add(k);
      pairs.push([ids[lo], ids[hi]]);
    }
  }

  const gaps = { seniority: [], sex: [], unlinked: [], described: [] };
  let named = 0;
  for (const [a, b] of pairs){
    const r = relationship(a, b);
    if (!r) continue;
    if (r.term){ named++; continue; }
    if (r.choice) gaps.seniority.push([a, b]);
    else if (/no traced link/.test(r.why)) gaps.unlinked.push([a, b]);
    else if (!state.people[a].sex || !state.people[b].sex) gaps.sex.push([a, b]);
    else gaps.described.push([a, b]);
  }

  // Which single missing fact is holding back the most answers. This is the
  // useful end of the analysis: not "23 unknown" but "ask Tendai's birth year".
  const blocking = new Map();
  const bump = (id, need) => {
    const k = id + '|' + need;
    blocking.set(k, (blocking.get(k) || 0) + 1);
  };
  for (const [a, b] of gaps.seniority){
    if (birthYear(a) === null) bump(a, 'born');
    if (birthYear(b) === null) bump(b, 'born');
  }
  for (const [a, b] of gaps.sex){
    if (!state.people[a].sex) bump(a, 'sex');
    if (!state.people[b].sex) bump(b, 'sex');
  }
  const asks = [...blocking.entries()]
    .map(([k, count]) => {
      const [id, need] = k.split('|');
      return { id, need, count };
    })
    .filter(x => state.people[x.id])
    .sort((x, y) => y.count - x.count)
    .slice(0, 6);

  return { named, checked: pairs.length, total, sampled, gaps, asks };
}

/* Day or night.
 
   Which one somebody wants is not a property of the family tree, it is a
   property of the person looking at it and the room they are sitting in. So
   like `meId` and the zoom, it lives on the device and never reaches the
   server: the same tree can be read at noon on a phone and at midnight on a
   laptop, and each is right.
 
   Three states, not two. "Auto" follows the device, which is what most people
   want and what the page did before this existed; the other two override it,
   for a bright room with a dark system setting or the reverse. */
const THEME_KEY = 'muti-baobab-theme';
const THEMES = [
  { v: '',      label: 'Auto'  },
  { v: 'light', label: 'Day'   },
  { v: 'dark',  label: 'Night' }
];

function applyTheme(v){
  const root = document && document.documentElement;
  if (!root || !root.dataset) return;
  if (v) root.dataset.theme = v; else delete root.dataset.theme;
  const btn = $('theme');
  if (btn && btn.classList){
    const t = THEMES.find(x => x.v === v) || THEMES[0];
    btn.textContent = t.label;
    btn.classList.toggle('set', !!v);
  }
}

function loadTheme(){
  let v = '';
  try { v = localStorage.getItem(THEME_KEY) || ''; } catch (e) {}
  if (!THEMES.some(t => t.v === v)) v = '';
  applyTheme(v);
}

function cycleTheme(){
  let cur = '';
  try { cur = localStorage.getItem(THEME_KEY) || ''; } catch (e) {}
  const next = THEMES[(THEMES.findIndex(t => t.v === cur) + 1) % THEMES.length];
  try {
    if (next.v) localStorage.setItem(THEME_KEY, next.v);
    else localStorage.removeItem(THEME_KEY);
  } catch (e) {}
  applyTheme(next.v);
  say(next.v === '' ? 'Following this device.' :
      next.v === 'light' ? 'Day.' : 'Night.');
}

/* Who is holding the phone. This never goes into the shared tree — each
   relative's own device remembers who they are, so the same tree reads
   differently, and correctly, for every one of them. */
const ME_KEY = 'muti-baobab-me';

function setMe(id){
  meId = id;
  pickingMe = false;
  try { id ? localStorage.setItem(ME_KEY, id) : localStorage.removeItem(ME_KEY); } catch (e) {}
  updateWho();
  render();
  if (id) say(`${state.people[id].name} is you. Tap anyone to see what they are to you.`);
}

function updateWho(){
  const btn = $('who');
  if (!btn) return;
  const p = meId && state.people[meId];
  btn.classList.toggle('active', pickingMe);
  btn.innerHTML = pickingMe ? 'Tap your own name' : `You: <b>${p ? esc(p.name.split(' ')[0]) : '—'}</b>`;
  btn.title = p ? `Terms are shown from ${p.name}'s side. Tap to change.`
                : 'Say who you are, and every name will tell you what they are to you.';
}

/* The ribbon under whoever is selected: the Shona term, and the trace that
   produced it, so it can be checked rather than taken on faith. */
function relationRibbon(spot){
  if (!spot) return '';
  const r = relationship(meId, sel);
  if (!r) return '';
  return `<div class="term${r.term ? '' : ' none'}" data-card="${sel}" role="button" tabindex="0"` +
    ` style="left:${spot[0].toFixed(1)}px; top:${spot[1].toFixed(1)}px">` +
    `<b>${esc(r.term || r.choice || 'Not named yet')}</b>` +
    `<span>${esc(r.why)}</span></div>`;
}

/* ── interaction ────────────────────────────────────────────────────── */
const budsEl = $('buds');
budsEl.addEventListener('pointerdown', e => { if (e.target.closest('.bud')) e.stopPropagation(); });
budsEl.addEventListener('click', e => {
  const ribbon = e.target.closest('.term');
  if (ribbon){ openCard(ribbon.dataset.card); return; }
  const bud = e.target.closest('.bud');
  if (bud) openForm(bud.dataset.bud, bud.dataset.anchor);
});
budsEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const t = e.target.closest('.bud,.term');
    if (t){ e.preventDefault(); t.click(); }
  }
});

podsEl.addEventListener('pointerdown', e => e.stopPropagation());
podsEl.addEventListener('click', e => {
  const card = e.target.closest('[data-card]');
  if (card){ openCard(card.dataset.card); return; }

  const ord = e.target.closest('.ord');
  if (ord){
    const who = ord.dataset.who;
    const kept = screenOf(who);
    reorder(who, Number(ord.dataset.ord));
    render();
    keepSteady(who, kept);
    save();
    say(`${state.people[who].name} is now ${rankLabel(who, true).toLowerCase() || 'moved'}.`);
    return;
  }
  const rm = e.target.closest('.rm');
  if (rm){
    const p = state.people[rm.dataset.rm];
    if (p && confirm(`Remove ${p.name} from the tree?`)){
      removePerson(p.id); sel = null; closeForm(); render(); save();
    }
    return;
  }
  const socket = e.target.closest('.socket');
  if (socket){ openForm('parent', socket.dataset.socket); return; }

  const pod = e.target.closest('.pod');
  if (pod){
    if (pickingMe){ setMe(pod.dataset.id); return; }
    sel = (sel === pod.dataset.id) ? null : pod.dataset.id;
    closeForm(); render();
    if (sel){ bringIntoView(sel); revealBuds(); }
  }
});
podsEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' || e.key === ' '){
    const t = e.target.closest('.ord,.rm,.pod');
    if (t){ e.preventDefault(); t.click(); }
  }
});

let drag = null;
const touches = new Map();   // pointerId -> {x,y}, so two fingers can pinch
let pinch = null;

const zoomAt = (k, cx, cy) => {
  k = Math.max(0.25, Math.min(2.4, k));
  pos.x = cx - (cx - pos.x) * (k / pos.k);
  pos.y = cy - (cy - pos.y) * (k / pos.k);
  pos.k = k;
  applyTransform();
};

stage.addEventListener('pointerdown', e => {
  if (e.target.closest('#form')) return;
  touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (touches.size === 2){
    const [a, b] = [...touches.values()];
    pinch = { d:Math.hypot(a.x - b.x, a.y - b.y), k:pos.k };
    drag = null;
    stage.classList.remove('dragging');
    return;
  }
  drag = { sx:e.clientX, sy:e.clientY, ox:pos.x, oy:pos.y, moved:false };
  stage.classList.add('dragging');
  stage.setPointerCapture(e.pointerId);
});
stage.addEventListener('pointermove', e => {
  if (touches.has(e.pointerId)) touches.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && touches.size === 2){
    const [a, b] = [...touches.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinch.d > 0) zoomAt(pinch.k * (d / pinch.d), (a.x + b.x)/2, (a.y + b.y)/2);
    return;
  }
  if (!drag) return;
  pos.x = drag.ox + (e.clientX - drag.sx);
  pos.y = drag.oy + (e.clientY - drag.sy);
  if (Math.abs(e.clientX - drag.sx) + Math.abs(e.clientY - drag.sy) > 4) drag.moved = true;
  applyTransform();
});
const endPointer = e => {
  touches.delete(e.pointerId);
  if (touches.size < 2) pinch = null;
  const wasDrag = drag && drag.moved;
  drag = null; stage.classList.remove('dragging');
  if (!wasDrag && !pinch && !e.target.closest('.pod,.bud,#form,#bar,#seed')){
    sel = null; closeForm(); render();
  }
};
stage.addEventListener('pointerup', endPointer);
stage.addEventListener('pointercancel', endPointer);
stage.addEventListener('wheel', e => {
  e.preventDefault();
  zoomAt(pos.k * (e.deltaY < 0 ? 1.12 : 1/1.12), e.clientX, e.clientY);
}, { passive:false });

function fit(){
  const pts = Object.values(layout.persons).concat((layout.sockets || []).map(q => ({ x:q.x, y:q.y })));
  if (!pts.length){ pos = { x:innerWidth/2, y:innerHeight*0.6, k:1 }; applyTransform(); return; }
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const minX = Math.min(...xs) - POD_W, maxX = Math.max(...xs) + POD_W;
  const minY = Math.min(...ys) - POD_H*1.8, maxY = Math.max(...ys) + POD_H*1.8;
  pos.k = Math.max(0.5, Math.min(1.15, Math.min((innerWidth - 80) / (maxX - minX || 1),
                                                (innerHeight - 170) / (maxY - minY || 1))));
  pos.x = innerWidth/2  - ((minX + maxX)/2) * pos.k;
  pos.y = innerHeight/2 - ((minY + maxY)/2) * pos.k;
  applyTransform();
}

$('who').onclick = () => {
  if (meId){ setMe(null); return; }
  pickingMe = !pickingMe;
  updateWho();
  say(pickingMe ? 'Tap your own name in the tree.' : '');
};

$('dupes').onclick = openDuplicates;
$('theme').onclick = cycleTheme;
$('kin').onclick = openKinship;

$('fit').onclick = fit;
$('undo').onclick = () => {
  if (!history.length) return;
  state = JSON.parse(history.pop());
  sel = null; closeForm(); render(); save();
};
$('clear').onclick = () => {
  if (!confirm('Clear the whole tree and start again?')) return;
  snapshot();
  state = { people:{}, unions:{}, rootId:null, seq:1 };
  sel = null; closeForm(); render(); save();
};

$('seedGo').onclick = plant;
$('seedName').addEventListener('keydown', e => { if (e.key === 'Enter') plant(); });
function plant(){
  const name = $('seedName').value.trim();
  if (!name){ $('seedName').focus(); return; }
  snapshot();
  state.rootId = sel = addPerson(name, '', '');
  $('seedName').value = '';
  pos = { x:innerWidth/2, y:innerHeight*0.6, k:1 };
  render(); save();
  say(`${name} planted. Tap them to grow the tree.`);
}

addEventListener('resize', applyTransform);
addEventListener('keydown', e => { if (e.key === 'Escape' && !pending && sel){ sel = null; render(); } });

/* ── storage ────────────────────────────────────────────────────────────
   On the deployed site this talks to the shared /api/shared endpoint so the
   whole family sees one tree. Anywhere else it quietly keeps the tree in
   this browser instead. */
let remote = false, timer = null;

async function load(){
  try {
    const r = await fetch('/api/shared/' + KEY, { headers:{ Accept:'application/json' } });
    if (r.ok && (r.headers.get('content-type') || '').includes('json')){
      remote = true;
      const d = await r.json();
      if (d && d.value) state = JSON.parse(d.value);
    }
  } catch (e) { /* not deployed — fine */ }
  if (!remote){
    try { const raw = localStorage.getItem(KEY); if (raw) state = JSON.parse(raw); } catch (e) {}
  }
  if (!state || !state.people) state = { people:{}, unions:{}, rootId:null, seq:1 };
  if (!state.notDuplicates) state.notDuplicates = [];
  try {
    const saved = localStorage.getItem(ME_KEY);
    if (saved && state.people[saved]) meId = saved;
  } catch (e) {}
  updateWho();
  render();
  if (people().length) fit();
}

function save(){
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const value = JSON.stringify(state);
    if (remote){
      try {
        await fetch('/api/shared/' + KEY, { method:'PUT',
          headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ value }) });
        return;
      } catch (e) { /* fall through */ }
    }
    try { localStorage.setItem(KEY, value); } catch (e) {}
  }, 400);
}

pos = { x:innerWidth/2, y:innerHeight*0.6, k:1 };
// Before anything paints, so the page never flashes the wrong one.
loadTheme();
buildBackdrop();
load();
</script>
</body>
</html>
